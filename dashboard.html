<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Personal OS — Productivity Dashboard</title>
  <script>
    // Apply saved theme before first paint to prevent flash of wrong theme
    (function () {
      try {
        var raw = localStorage.getItem('personal_os_dashboard_v1');
        var theme = null;
        if (raw) {
          var parsed = JSON.parse(raw);
          if (parsed && parsed.settings && (parsed.settings.theme === 'dark' || parsed.settings.theme === 'light')) {
            theme = parsed.settings.theme;
          }
        }
        if (!theme) {
          theme = (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
        }
        document.documentElement.setAttribute('data-theme', theme);
      } catch (e) {
        document.documentElement.setAttribute('data-theme', 'light');
      }
    })();
  </script>
  <style>
    /* =========================================================================
       DESIGN TOKENS & THEMES
       ========================================================================= */
    :root {
      --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, "Helvetica Neue", sans-serif;
      --font-mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;

      /* Light theme surfaces */
      --bg-app: #f4f5f7;
      --bg-sidebar: #eceef2;
      --bg-surface: #ffffff;
      --bg-surface-subtle: #f8f9fb;
      --bg-surface-hover: #f1f3f6;
      --bg-input: #ffffff;
      --bg-overlay: rgba(15, 23, 42, 0.45);

      /* Borders */
      --border: #e2e5ec;
      --border-strong: #cfd5e0;
      --border-subtle: #edf0f5;

      /* Typography */
      --text-primary: #111827;
      --text-secondary: #4b5563;
      --text-muted: #6b7280;
      --text-inverse: #ffffff;

      /* Accent */
      --accent: #2563eb;
      --accent-hover: #1d4ed8;
      --accent-soft: rgba(37, 99, 235, 0.10);
      --accent-border: rgba(37, 99, 235, 0.28);

      /* Semantic colors */
      --danger: #dc2626;
      --danger-hover: #b91c1c;
      --danger-soft: rgba(220, 38, 38, 0.10);
      --danger-border: rgba(220, 38, 38, 0.28);

      --warning: #d97706;
      --warning-soft: rgba(217, 119, 6, 0.12);
      --warning-border: rgba(217, 119, 6, 0.30);

      --success: #059669;
      --success-soft: rgba(5, 150, 105, 0.10);
      --success-border: rgba(5, 150, 105, 0.28);

      --info: #0284c7;
      --info-soft: rgba(2, 132, 199, 0.10);
      --info-border: rgba(2, 132, 199, 0.28);

      --purple: #7c3aed;
      --purple-soft: rgba(124, 58, 237, 0.10);

      /* Priority colors */
      --priority-high: #dc2626;
      --priority-high-bg: rgba(220, 38, 38, 0.11);
      --priority-medium: #d97706;
      --priority-medium-bg: rgba(217, 119, 6, 0.12);
      --priority-low: #0284c7;
      --priority-low-bg: rgba(2, 132, 199, 0.11);

      /* Elevation & Layout */
      --shadow-xs: 0 1px 2px rgba(15, 23, 42, 0.04);
      --shadow-sm: 0 2px 6px rgba(15, 23, 42, 0.06);
      --shadow-md: 0 10px 28px rgba(15, 23, 42, 0.12);
      --shadow-lg: 0 20px 48px rgba(15, 23, 42, 0.18);

      --radius-sm: 6px;
      --radius-md: 10px;
      --radius-lg: 14px;
      --sidebar-width: 244px;
      --topbar-height: 58px;
      --transition: 150ms cubic-bezier(0.2, 0, 0, 1);
    }

    [data-theme="dark"] {
      --bg-app: #0e1015;
      --bg-sidebar: #13161e;
      --bg-surface: #181c26;
      --bg-surface-subtle: #141821;
      --bg-surface-hover: #212634;
      --bg-input: #11141c;
      --bg-overlay: rgba(4, 6, 12, 0.72);

      --border: #252b3b;
      --border-strong: #353d52;
      --border-subtle: #1e2330;

      --text-primary: #f1f5f9;
      --text-secondary: #a8b3c7;
      --text-muted: #76839a;
      --text-inverse: #ffffff;

      --accent: #3b82f6;
      --accent-hover: #2563eb;
      --accent-soft: rgba(59, 130, 246, 0.16);
      --accent-border: rgba(59, 130, 246, 0.36);

      --danger: #f87171;
      --danger-hover: #ef4444;
      --danger-soft: rgba(248, 113, 113, 0.15);
      --danger-border: rgba(248, 113, 113, 0.35);

      --warning: #fbbf24;
      --warning-soft: rgba(251, 191, 36, 0.14);
      --warning-border: rgba(251, 191, 36, 0.34);

      --success: #34d399;
      --success-soft: rgba(52, 211, 153, 0.14);
      --success-border: rgba(52, 211, 153, 0.34);

      --info: #38bdf8;
      --info-soft: rgba(56, 189, 248, 0.15);
      --info-border: rgba(56, 189, 248, 0.34);

      --purple: #a78bfa;
      --purple-soft: rgba(167, 139, 250, 0.15);

      --priority-high: #f87171;
      --priority-high-bg: rgba(248, 113, 113, 0.16);
      --priority-medium: #fbbf24;
      --priority-medium-bg: rgba(251, 191, 36, 0.15);
      --priority-low: #38bdf8;
      --priority-low-bg: rgba(56, 189, 248, 0.16);

      --shadow-xs: 0 1px 2px rgba(0, 0, 0, 0.25);
      --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.32);
      --shadow-md: 0 12px 32px rgba(0, 0, 0, 0.45);
      --shadow-lg: 0 24px 56px rgba(0, 0, 0, 0.6);
    }

    /* =========================================================================
       RESET & BASE
       ========================================================================= */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      height: 100%;
      font-family: var(--font-sans);
      font-size: 14px;
      line-height: 1.5;
      color: var(--text-primary);
      background: var(--bg-app);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    button, input, select, textarea {
      font: inherit;
      color: inherit;
    }

    button {
      cursor: pointer;
      background: none;
      border: none;
    }

    input, select, textarea {
      background: var(--bg-input);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      color: var(--text-primary);
      transition: border-color var(--transition), box-shadow var(--transition);
    }

    input:focus, select:focus, textarea:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-soft);
    }

    [data-theme="dark"] input[type="date"] {
      color-scheme: dark;
    }

    .tabular-nums {
      font-variant-numeric: tabular-nums;
    }

    /* Subtle desktop scrollbars */
    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: var(--border-strong);
      border-radius: 99px;
      border: 2px solid transparent;
      background-clip: content-box;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: var(--text-muted);
      border: 2px solid transparent;
      background-clip: content-box;
    }

    /* =========================================================================
       APP SHELL LAYOUT
       ========================================================================= */
    .app-shell {
      display: flex;
      height: 100vh;
      overflow: hidden;
    }

    /* Sidebar */
    .sidebar {
      width: var(--sidebar-width);
      flex-shrink: 0;
      background: var(--bg-sidebar);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      user-select: none;
      z-index: 40;
      transition: transform 200ms ease;
    }

    .sidebar-brand {
      height: var(--topbar-height);
      padding: 0 18px;
      display: flex;
      align-items: center;
      gap: 10px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }

    .brand-logo {
      width: 28px;
      height: 28px;
      border-radius: 8px;
      background: var(--accent);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      box-shadow: var(--shadow-xs);
    }

    .brand-text {
      display: flex;
      flex-direction: column;
      line-height: 1.2;
    }

    .brand-name {
      font-weight: 700;
      font-size: 14px;
      letter-spacing: -0.01em;
    }

    .brand-sub {
      font-size: 11px;
      color: var(--text-muted);
    }

    .sidebar-nav {
      flex: 1;
      padding: 14px 10px;
      display: flex;
      flex-direction: column;
      gap: 2px;
      overflow-y: auto;
    }

    .nav-label {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--text-muted);
      padding: 6px 10px 8px;
    }

    .nav-item {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
      padding: 9px 11px;
      border-radius: var(--radius-sm);
      font-size: 13.5px;
      font-weight: 500;
      color: var(--text-secondary);
      transition: background var(--transition), color var(--transition);
      text-align: left;
      position: relative;
    }

    .nav-item:hover {
      background: var(--bg-surface-hover);
      color: var(--text-primary);
    }

    .nav-item.active {
      background: var(--bg-surface);
      color: var(--text-primary);
      font-weight: 600;
      box-shadow: var(--shadow-xs);
    }

    .nav-item.active::before {
      content: "";
      position: absolute;
      left: 0;
      top: 7px;
      bottom: 7px;
      width: 3px;
      border-radius: 0 3px 3px 0;
      background: var(--accent);
    }

    .nav-item svg {
      width: 17px;
      height: 17px;
      flex-shrink: 0;
      opacity: 0.8;
    }

    .nav-item.active svg {
      color: var(--accent);
      opacity: 1;
    }

    .nav-item-label {
      flex: 1;
    }

    .nav-badge {
      font-size: 11px;
      font-weight: 600;
      padding: 1px 7px;
      border-radius: 99px;
      background: var(--bg-surface-hover);
      color: var(--text-secondary);
      font-variant-numeric: tabular-nums;
    }

    .nav-badge.alert {
      background: var(--danger-soft);
      color: var(--danger);
    }

    .nav-badge.warn {
      background: var(--warning-soft);
      color: var(--warning);
    }

    /* Unobtrusive backup footer */
    .sidebar-footer {
      padding: 12px 12px 14px;
      border-top: 1px solid var(--border);
      flex-shrink: 0;
    }

    .backup-title {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
      margin-bottom: 8px;
      padding: 0 2px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .backup-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
    }

    .btn-backup {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      padding: 6px 8px;
      font-size: 12px;
      font-weight: 500;
      color: var(--text-secondary);
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      transition: background var(--transition), color var(--transition), border-color var(--transition);
    }

    .btn-backup:hover {
      background: var(--bg-surface-hover);
      color: var(--text-primary);
      border-color: var(--border-strong);
    }

    .btn-backup svg {
      width: 13px;
      height: 13px;
      flex-shrink: 0;
    }

    /* Main Column */
    .main-area {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Top Bar */
    .topbar {
      height: var(--topbar-height);
      flex-shrink: 0;
      background: var(--bg-surface);
      border-bottom: 1px solid var(--border);
      padding: 0 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      z-index: 30;
    }

    .topbar-left {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    .mobile-menu-btn {
      display: none;
      width: 34px;
      height: 34px;
      align-items: center;
      justify-content: center;
      border-radius: var(--radius-sm);
      color: var(--text-secondary);
      border: 1px solid var(--border);
    }

    .mobile-menu-btn:hover {
      background: var(--bg-surface-hover);
      color: var(--text-primary);
    }

    .page-heading {
      display: flex;
      align-items: baseline;
      gap: 10px;
      min-width: 0;
    }

    .page-title {
      font-size: 16px;
      font-weight: 700;
      letter-spacing: -0.015em;
      white-space: nowrap;
    }

    .page-subtitle {
      font-size: 12.5px;
      color: var(--text-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .topbar-right {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
    }

    /* Global Search */
    .search-container {
      position: relative;
      width: 310px;
    }

    .search-input-wrap {
      position: relative;
      display: flex;
      align-items: center;
    }

    .search-icon {
      position: absolute;
      left: 10px;
      width: 15px;
      height: 15px;
      color: var(--text-muted);
      pointer-events: none;
    }

    .search-input {
      width: 100%;
      height: 34px;
      padding: 0 58px 0 32px;
      font-size: 13px;
      background: var(--bg-surface-subtle);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
    }

    .search-input:focus {
      background: var(--bg-input);
    }

    .search-kbd {
      position: absolute;
      right: 8px;
      font-size: 10.5px;
      font-family: var(--font-mono);
      color: var(--text-muted);
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 1px 5px;
      pointer-events: none;
    }

    .search-clear {
      position: absolute;
      right: 6px;
      width: 22px;
      height: 22px;
      display: none;
      align-items: center;
      justify-content: center;
      border-radius: 4px;
      color: var(--text-muted);
    }

    .search-clear:hover {
      background: var(--bg-surface-hover);
      color: var(--text-primary);
    }

    .search-container.has-query .search-kbd {
      display: none;
    }

    .search-container.has-query .search-clear {
      display: inline-flex;
    }

    .search-dropdown {
      position: absolute;
      top: calc(100% + 6px);
      right: 0;
      width: 440px;
      max-width: calc(100vw - 32px);
      max-height: 440px;
      overflow-y: auto;
      background: var(--bg-surface);
      border: 1px solid var(--border-strong);
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-md);
      display: none;
      z-index: 100;
    }

    .search-dropdown.open {
      display: block;
    }

    .search-dropdown-header {
      padding: 9px 12px;
      border-bottom: 1px solid var(--border-subtle);
      font-size: 11.5px;
      font-weight: 600;
      color: var(--text-muted);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .search-result-item {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      padding: 10px 12px;
      width: 100%;
      text-align: left;
      border-bottom: 1px solid var(--border-subtle);
      transition: background var(--transition);
    }

    .search-result-item:last-child {
      border-bottom: none;
    }

    .search-result-item:hover,
    .search-result-item.active {
      background: var(--bg-surface-hover);
    }

    .search-section-tag {
      font-size: 10.5px;
      font-weight: 600;
      padding: 2px 7px;
      border-radius: 99px;
      white-space: nowrap;
      flex-shrink: 0;
      margin-top: 2px;
    }

    .search-section-tag.kanban { background: var(--accent-soft); color: var(--accent); }
    .search-section-tag.calendar { background: var(--purple-soft); color: var(--purple); }
    .search-section-tag.subscriptions { background: var(--warning-soft); color: var(--warning); }
    .search-section-tag.goals { background: var(--success-soft); color: var(--success); }

    .search-result-body {
      flex: 1;
      min-width: 0;
    }

    .search-result-title {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-primary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .search-result-meta {
      font-size: 12px;
      color: var(--text-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-top: 2px;
    }

    .search-mark {
      background: var(--warning-soft);
      color: var(--text-primary);
      border-radius: 2px;
      padding: 0 2px;
      font-weight: 600;
    }

    .search-empty {
      padding: 28px 16px;
      text-align: center;
      color: var(--text-muted);
      font-size: 13px;
    }

    /* Buttons */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      height: 34px;
      padding: 0 13px;
      font-size: 13px;
      font-weight: 500;
      border-radius: var(--radius-sm);
      border: 1px solid transparent;
      transition: background var(--transition), border-color var(--transition), color var(--transition), transform 80ms ease;
      white-space: nowrap;
    }

    .btn:active {
      transform: translateY(0.5px);
    }

    .btn svg {
      width: 15px;
      height: 15px;
      flex-shrink: 0;
    }

    .btn-primary {
      background: var(--accent);
      color: var(--text-inverse);
    }

    .btn-primary:hover {
      background: var(--accent-hover);
    }

    .btn-secondary {
      background: var(--bg-surface);
      border-color: var(--border);
      color: var(--text-primary);
    }

    .btn-secondary:hover {
      background: var(--bg-surface-hover);
      border-color: var(--border-strong);
    }

    .btn-danger {
      background: var(--danger);
      color: var(--text-inverse);
    }

    .btn-danger:hover {
      background: var(--danger-hover);
    }

    .btn-ghost {
      color: var(--text-secondary);
      padding: 0 8px;
    }

    .btn-ghost:hover {
      background: var(--bg-surface-hover);
      color: var(--text-primary);
    }

    .btn-icon {
      width: 34px;
      height: 34px;
      padding: 0;
      border: 1px solid var(--border);
      background: var(--bg-surface);
      color: var(--text-secondary);
      border-radius: var(--radius-sm);
    }

    .btn-icon:hover {
      background: var(--bg-surface-hover);
      color: var(--text-primary);
      border-color: var(--border-strong);
    }

    .btn-sm {
      height: 28px;
      padding: 0 9px;
      font-size: 12px;
    }

    .icon-action {
      width: 26px;
      height: 26px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 5px;
      color: var(--text-muted);
      transition: background var(--transition), color var(--transition);
    }

    .icon-action:hover {
      background: var(--bg-surface-hover);
      color: var(--text-primary);
    }

    .icon-action.delete:hover {
      background: var(--danger-soft);
      color: var(--danger);
    }

    .icon-action svg {
      width: 14px;
      height: 14px;
    }

    /* Workspace Container */
    .workspace {
      flex: 1;
      overflow-y: auto;
      padding: 22px 24px 32px;
    }

    .workspace-inner {
      max-width: 1440px;
      margin: 0 auto;
    }

    /* =========================================================================
       SHARED CARDS, BADGES & EMPTY STATES
       ========================================================================= */
    .panel {
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-xs);
      display: flex;
      flex-direction: column;
    }

    .panel-header {
      padding: 14px 16px;
      border-bottom: 1px solid var(--border-subtle);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .panel-title-group {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
    }

    .panel-title {
      font-size: 14px;
      font-weight: 650;
      letter-spacing: -0.01em;
    }

    .panel-count {
      font-size: 11.5px;
      font-weight: 600;
      color: var(--text-muted);
      background: var(--bg-surface-subtle);
      border: 1px solid var(--border);
      padding: 0 7px;
      border-radius: 99px;
      font-variant-numeric: tabular-nums;
    }

    .panel-body {
      padding: 12px 16px 16px;
    }

    .panel-link {
      font-size: 12px;
      font-weight: 500;
      color: var(--accent);
      display: inline-flex;
      align-items: center;
      gap: 3px;
    }

    .panel-link:hover {
      text-decoration: underline;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 11px;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 99px;
      white-space: nowrap;
      line-height: 1.4;
    }

    .badge svg {
      width: 11px;
      height: 11px;
    }

    .badge-high { background: var(--priority-high-bg); color: var(--priority-high); }
    .badge-medium { background: var(--priority-medium-bg); color: var(--priority-medium); }
    .badge-low { background: var(--priority-low-bg); color: var(--priority-low); }

    .badge-overdue { background: var(--danger-soft); color: var(--danger); }
    .badge-today { background: var(--warning-soft); color: var(--warning); }
    .badge-upcoming { background: var(--accent-soft); color: var(--accent); }
    .badge-done { background: var(--success-soft); color: var(--success); }
    .badge-neutral { background: var(--bg-surface-hover); color: var(--text-secondary); }

    .empty-state {
      padding: 28px 16px;
      text-align: center;
      color: var(--text-muted);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }

    .empty-state-icon {
      width: 38px;
      height: 38px;
      border-radius: 10px;
      background: var(--bg-surface-subtle);
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-muted);
    }

    .empty-state-title {
      font-size: 13.5px;
      font-weight: 600;
      color: var(--text-secondary);
    }

    .empty-state-desc {
      font-size: 12.5px;
      color: var(--text-muted);
      max-width: 300px;
    }

    /* Highlight pulse when navigating from search */
    @keyframes highlightPulse {
      0% { box-shadow: 0 0 0 0 var(--accent); }
      35% { box-shadow: 0 0 0 4px var(--accent-soft), 0 0 0 2px var(--accent); }
      100% { box-shadow: 0 0 0 0 transparent; }
    }

    .flash-highlight {
      animation: highlightPulse 1.6s ease-out;
    }

    /* =========================================================================
       DASHBOARD VIEW
       ========================================================================= */
    .kpi-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 14px;
      margin-bottom: 18px;
    }

    .kpi-card {
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 14px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      text-align: left;
      box-shadow: var(--shadow-xs);
      transition: border-color var(--transition), transform var(--transition), box-shadow var(--transition);
    }

    .kpi-card:hover {
      border-color: var(--border-strong);
      box-shadow: var(--shadow-sm);
      transform: translateY(-1px);
    }

    .kpi-meta {
      min-width: 0;
    }

    .kpi-label {
      font-size: 12px;
      font-weight: 500;
      color: var(--text-muted);
      margin-bottom: 4px;
    }

    .kpi-value {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.02em;
      line-height: 1.15;
      font-variant-numeric: tabular-nums;
    }

    .kpi-sub {
      font-size: 11.5px;
      color: var(--text-muted);
      margin-top: 4px;
    }

    .kpi-icon {
      width: 38px;
      height: 38px;
      border-radius: 9px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .kpi-icon.blue { background: var(--accent-soft); color: var(--accent); }
    .kpi-icon.purple { background: var(--purple-soft); color: var(--purple); }
    .kpi-icon.green { background: var(--success-soft); color: var(--success); }
    .kpi-icon.amber { background: var(--warning-soft); color: var(--warning); }

    .dashboard-grid {
      display: grid;
      grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr);
      gap: 18px;
      align-items: start;
    }

    .dashboard-col {
      display: flex;
      flex-direction: column;
      gap: 18px;
      min-width: 0;
    }

    /* Actionable list rows on Dashboard */
    .action-list {
      display: flex;
      flex-direction: column;
    }

    .action-row {
      display: flex;
      align-items: center;
      gap: 11px;
      padding: 10px 6px;
      border-bottom: 1px solid var(--border-subtle);
      border-radius: var(--radius-sm);
      transition: background var(--transition);
    }

    .action-row:last-child {
      border-bottom: none;
    }

    .action-row:hover {
      background: var(--bg-surface-subtle);
    }

    .quick-check {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      border: 1.75px solid var(--border-strong);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      color: transparent;
      transition: border-color var(--transition), background var(--transition), color var(--transition);
    }

    .quick-check:hover {
      border-color: var(--success);
      background: var(--success-soft);
      color: var(--success);
    }

    .action-row-main {
      flex: 1;
      min-width: 0;
      cursor: pointer;
    }

    .action-row-title {
      font-size: 13.5px;
      font-weight: 500;
      color: var(--text-primary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .action-row-sub {
      font-size: 12px;
      color: var(--text-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-top: 1px;
    }

    .action-row-right {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }

    /* Kanban summary widget */
    .kanban-summary-bar {
      height: 10px;
      border-radius: 99px;
      background: var(--bg-surface-hover);
      overflow: hidden;
      display: flex;
      margin-bottom: 14px;
    }

    .ks-seg-todo { background: var(--text-muted); opacity: 0.55; }
    .ks-seg-progress { background: var(--accent); }
    .ks-seg-done { background: var(--success); }

    .kanban-summary-cols {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }

    .ks-stat {
      padding: 10px 12px;
      background: var(--bg-surface-subtle);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-sm);
      cursor: pointer;
      transition: border-color var(--transition), background var(--transition);
    }

    .ks-stat:hover {
      border-color: var(--border-strong);
      background: var(--bg-surface-hover);
    }

    .ks-stat-head {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      color: var(--text-secondary);
      margin-bottom: 4px;
    }

    .ks-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
    }

    .ks-stat-num {
      font-size: 19px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
    }

    /* Dashboard goal compact item */
    .dash-goal-item {
      padding: 10px 4px;
      border-bottom: 1px solid var(--border-subtle);
    }

    .dash-goal-item:last-child {
      border-bottom: none;
    }

    .dash-goal-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 6px;
    }

    .dash-goal-title {
      font-size: 13px;
      font-weight: 600;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      cursor: pointer;
    }

    .dash-goal-title:hover {
      color: var(--accent);
    }

    .dash-goal-stats {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      color: var(--text-secondary);
      font-variant-numeric: tabular-nums;
      flex-shrink: 0;
    }

    .progress-track {
      height: 7px;
      border-radius: 99px;
      background: var(--bg-surface-hover);
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      border-radius: 99px;
      background: var(--accent);
      transition: width 240ms ease;
    }

    .progress-fill.completed {
      background: var(--success);
    }

    /* =========================================================================
       KANBAN VIEW
       ========================================================================= */
    .section-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 16px;
    }

    .filter-pills {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 3px;
    }

    .filter-pill {
      padding: 4px 10px;
      font-size: 12px;
      font-weight: 500;
      border-radius: 4px;
      color: var(--text-secondary);
      transition: background var(--transition), color var(--transition);
    }

    .filter-pill:hover {
      color: var(--text-primary);
    }

    .filter-pill.active {
      background: var(--accent-soft);
      color: var(--accent);
      font-weight: 600;
    }

    .kanban-board {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 16px;
      align-items: start;
    }

    .kanban-column {
      background: var(--bg-surface-subtle);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      display: flex;
      flex-direction: column;
      min-height: calc(100vh - 205px);
      transition: border-color var(--transition), background var(--transition);
    }

    .kanban-column.is-drag-over {
      border-color: var(--accent);
      background: var(--accent-soft);
    }

    .kanban-col-header {
      padding: 12px 14px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .kanban-col-title-wrap {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .kanban-col-title {
      font-size: 13.5px;
      font-weight: 650;
    }

    .kanban-col-body {
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      flex: 1;
    }

    .kanban-card {
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-left-width: 3.5px;
      border-radius: var(--radius-sm);
      padding: 11px 12px;
      box-shadow: var(--shadow-xs);
      cursor: grab;
      transition: transform var(--transition), box-shadow var(--transition), border-color var(--transition), opacity var(--transition);
      position: relative;
    }

    .kanban-card:hover {
      box-shadow: var(--shadow-sm);
      border-color: var(--border-strong);
    }

    .kanban-card:active {
      cursor: grabbing;
    }

    .kanban-card.priority-high { border-left-color: var(--priority-high); }
    .kanban-card.priority-medium { border-left-color: var(--priority-medium); }
    .kanban-card.priority-low { border-left-color: var(--priority-low); }

    .kanban-card.is-dragging {
      opacity: 0.42;
      transform: scale(0.98);
    }

    .kanban-card.drop-before {
      box-shadow: 0 -3px 0 0 var(--accent);
    }

    .kanban-card.drop-after {
      box-shadow: 0 3px 0 0 var(--accent);
    }

    .kanban-card-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 8px;
    }

    .kanban-card-title {
      font-size: 13.5px;
      font-weight: 600;
      line-height: 1.35;
      color: var(--text-primary);
      word-break: break-word;
    }

    .kanban-card.is-done .kanban-card-title {
      text-decoration: line-through;
      color: var(--text-muted);
    }

    .kanban-card-actions {
      display: flex;
      align-items: center;
      gap: 2px;
      opacity: 0.35;
      transition: opacity var(--transition);
      flex-shrink: 0;
    }

    .kanban-card:hover .kanban-card-actions,
    .kanban-card:focus-within .kanban-card-actions {
      opacity: 1;
    }

    .kanban-card-notes {
      font-size: 12.5px;
      color: var(--text-secondary);
      margin-top: 6px;
      white-space: pre-wrap;
      word-break: break-word;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .kanban-card-footer {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 10px;
    }

    .kanban-empty-col {
      padding: 24px 12px;
      text-align: center;
      font-size: 12.5px;
      color: var(--text-muted);
      border: 1px dashed var(--border);
      border-radius: var(--radius-sm);
    }

    /* =========================================================================
       CALENDAR VIEW
       ========================================================================= */
    .calendar-layout {
      display: grid;
      grid-template-columns: minmax(0, 1.55fr) minmax(300px, 1fr);
      gap: 18px;
      align-items: start;
    }

    .calendar-nav {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .calendar-month-label {
      font-size: 15px;
      font-weight: 700;
      min-width: 150px;
    }

    .calendar-weekdays {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      border-bottom: 1px solid var(--border);
      background: var(--bg-surface-subtle);
    }

    .calendar-weekday {
      padding: 8px 6px;
      text-align: center;
      font-size: 11.5px;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .calendar-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
    }

    .cal-cell {
      min-height: 98px;
      padding: 6px;
      border-right: 1px solid var(--border-subtle);
      border-bottom: 1px solid var(--border-subtle);
      display: flex;
      flex-direction: column;
      gap: 3px;
      cursor: pointer;
      transition: background var(--transition);
      position: relative;
      min-width: 0;
    }

    .cal-cell:nth-child(7n) {
      border-right: none;
    }

    .cal-cell:hover {
      background: var(--bg-surface-hover);
    }

    .cal-cell.other-month {
      background: var(--bg-surface-subtle);
      opacity: 0.55;
    }

    .cal-cell.selected {
      background: var(--accent-soft);
      box-shadow: inset 0 0 0 1.5px var(--accent);
    }

    .cal-cell-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 2px;
    }

    .cal-day-num {
      font-size: 12px;
      font-weight: 600;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-variant-numeric: tabular-nums;
    }

    .cal-cell.is-today .cal-day-num {
      background: var(--accent);
      color: #fff;
    }

    .cal-add-mini {
      width: 20px;
      height: 20px;
      border-radius: 4px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: var(--text-muted);
      opacity: 0;
      transition: opacity var(--transition), background var(--transition);
    }

    .cal-cell:hover .cal-add-mini {
      opacity: 1;
    }

    .cal-add-mini:hover {
      background: var(--bg-surface);
      color: var(--accent);
    }

    .cal-event-pill {
      font-size: 11px;
      font-weight: 500;
      padding: 2px 6px;
      border-radius: 4px;
      background: var(--purple-soft);
      color: var(--purple);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      text-align: left;
      width: 100%;
      transition: filter var(--transition);
    }

    .cal-event-pill:hover {
      filter: brightness(0.92);
    }

    .cal-more-label {
      font-size: 10.5px;
      font-weight: 600;
      color: var(--text-muted);
      padding: 0 4px;
    }

    .agenda-tabs {
      display: flex;
      gap: 4px;
      padding: 10px 14px 0;
      border-bottom: 1px solid var(--border-subtle);
    }

    .agenda-tab {
      padding: 6px 10px 9px;
      font-size: 12.5px;
      font-weight: 500;
      color: var(--text-muted);
      border-bottom: 2px solid transparent;
      margin-bottom: -1px;
    }

    .agenda-tab:hover {
      color: var(--text-primary);
    }

    .agenda-tab.active {
      color: var(--accent);
      font-weight: 600;
      border-bottom-color: var(--accent);
    }

    .event-list {
      display: flex;
      flex-direction: column;
      max-height: 540px;
      overflow-y: auto;
    }

    .event-item {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      padding: 12px 16px;
      border-bottom: 1px solid var(--border-subtle);
      transition: background var(--transition);
    }

    .event-item:last-child {
      border-bottom: none;
    }

    .event-item:hover {
      background: var(--bg-surface-subtle);
    }

    .event-item.is-past {
      opacity: 0.65;
    }

    .event-date-box {
      width: 44px;
      flex-shrink: 0;
      text-align: center;
      background: var(--bg-surface-subtle);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 4px 2px;
      line-height: 1.15;
    }

    .event-item.is-today .event-date-box {
      background: var(--accent-soft);
      border-color: var(--accent-border);
      color: var(--accent);
    }

    .event-date-mon {
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .event-date-day {
      font-size: 16px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
    }

    .event-item-body {
      flex: 1;
      min-width: 0;
    }

    .event-item-title {
      font-size: 13.5px;
      font-weight: 600;
      word-break: break-word;
    }

    .event-item-meta {
      font-size: 11.5px;
      color: var(--text-muted);
      margin-top: 2px;
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }

    .event-item-notes {
      font-size: 12.5px;
      color: var(--text-secondary);
      margin-top: 5px;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .event-item-actions {
      display: flex;
      gap: 2px;
      flex-shrink: 0;
    }

    /* =========================================================================
       SUBSCRIPTIONS VIEW
       ========================================================================= */
    .sub-summary-strip {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 12px;
      margin-bottom: 16px;
    }

    .sub-stat-card {
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 13px 16px;
      box-shadow: var(--shadow-xs);
    }

    .sub-stat-label {
      font-size: 12px;
      color: var(--text-muted);
      margin-bottom: 4px;
    }

    .sub-stat-value {
      font-size: 20px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
    }

    .sub-stat-card.highlight {
      border-color: var(--warning-border);
      background: var(--warning-soft);
    }

    .sub-controls {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .sub-select {
      height: 32px;
      padding: 0 28px 0 10px;
      font-size: 12.5px;
    }

    .sub-table-wrap {
      overflow-x: auto;
    }

    .sub-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }

    .sub-table th {
      text-align: left;
      padding: 10px 14px;
      font-size: 11.5px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--text-muted);
      background: var(--bg-surface-subtle);
      border-bottom: 1px solid var(--border);
      white-space: nowrap;
    }

    .sub-table td {
      padding: 12px 14px;
      border-bottom: 1px solid var(--border-subtle);
      vertical-align: middle;
    }

    .sub-table tbody tr:last-child td {
      border-bottom: none;
    }

    .sub-table tbody tr:hover {
      background: var(--bg-surface-subtle);
    }

    .sub-table tbody tr.renewing-soon {
      background: var(--warning-soft);
    }

    .sub-table tbody tr.renewing-soon td:first-child {
      box-shadow: inset 3.5px 0 0 0 var(--warning);
    }

    .sub-table tbody tr.is-ended {
      opacity: 0.58;
    }

    .sub-name {
      font-weight: 600;
      color: var(--text-primary);
    }

    .sub-notes {
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 2px;
      max-width: 280px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .sub-cost-cell {
      font-weight: 650;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }

    .sub-cost-norm {
      font-size: 11.5px;
      font-weight: 400;
      color: var(--text-muted);
    }

    /* =========================================================================
       GOALS VIEW
       ========================================================================= */
    .goals-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
      gap: 16px;
    }

    .goal-card {
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 16px 18px;
      box-shadow: var(--shadow-xs);
      display: flex;
      flex-direction: column;
      gap: 12px;
      transition: border-color var(--transition), box-shadow var(--transition);
    }

    .goal-card:hover {
      border-color: var(--border-strong);
      box-shadow: var(--shadow-sm);
    }

    .goal-card.is-completed {
      border-color: var(--success-border);
      background: linear-gradient(180deg, var(--success-soft) 0%, var(--bg-surface) 42%);
    }

    .goal-card-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 10px;
    }

    .goal-title-wrap {
      min-width: 0;
    }

    .goal-title {
      font-size: 15px;
      font-weight: 650;
      line-height: 1.3;
      word-break: break-word;
    }

    .goal-meta-row {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 5px;
    }

    .goal-numbers {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      padding: 10px 12px;
      background: var(--bg-surface-subtle);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-sm);
    }

    .goal-num-item {
      display: flex;
      flex-direction: column;
    }

    .goal-num-label {
      font-size: 11px;
      color: var(--text-muted);
    }

    .goal-num-val {
      font-size: 15px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      margin-top: 1px;
    }

    .goal-progress-wrap {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .goal-progress-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
      color: var(--text-secondary);
      font-variant-numeric: tabular-nums;
    }

    .goal-quick-controls {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding-top: 10px;
      border-top: 1px solid var(--border-subtle);
      flex-wrap: wrap;
    }

    .goal-step-btns {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .btn-step {
      height: 28px;
      min-width: 34px;
      padding: 0 8px;
      font-size: 12px;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
      background: var(--bg-surface-subtle);
      border: 1px solid var(--border);
      border-radius: 5px;
      color: var(--text-primary);
      transition: background var(--transition), border-color var(--transition);
    }

    .btn-step:hover {
      background: var(--bg-surface-hover);
      border-color: var(--border-strong);
    }

    .goal-custom-add {
      display: flex;
      align-items: center;
      gap: 5px;
      flex: 1;
      justify-content: flex-end;
      min-width: 140px;
    }

    .goal-delta-input {
      width: 86px;
      height: 28px;
      padding: 0 8px;
      font-size: 12px;
      font-variant-numeric: tabular-nums;
    }

    /* =========================================================================
       MODALS & TOASTS
       ========================================================================= */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: var(--bg-overlay);
      backdrop-filter: blur(3px);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 200;
    }

    .modal-backdrop.open {
      display: flex;
    }

    .modal-backdrop.confirm-layer {
      z-index: 250;
    }

    .modal {
      width: 100%;
      max-width: 480px;
      max-height: calc(100vh - 40px);
      background: var(--bg-surface);
      border: 1px solid var(--border-strong);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-lg);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      animation: modalIn 140ms ease-out;
    }

    .modal.modal-sm {
      max-width: 410px;
    }

    @keyframes modalIn {
      from { opacity: 0; transform: translateY(6px) scale(0.98); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    .modal-header {
      padding: 16px 20px;
      border-bottom: 1px solid var(--border-subtle);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .modal-title {
      font-size: 15.5px;
      font-weight: 700;
      letter-spacing: -0.01em;
    }

    .modal-body {
      padding: 18px 20px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .modal-footer {
      padding: 14px 20px;
      border-top: 1px solid var(--border-subtle);
      background: var(--bg-surface-subtle);
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 8px;
    }

    .form-field {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .form-label {
      font-size: 12.5px;
      font-weight: 600;
      color: var(--text-secondary);
    }

    .form-label .req {
      color: var(--danger);
    }

    .form-input, .form-select, .form-textarea {
      width: 100%;
      padding: 8px 10px;
      font-size: 13.5px;
    }

    .form-textarea {
      min-height: 84px;
      resize: vertical;
      line-height: 1.45;
    }

    .form-error {
      font-size: 12.5px;
      color: var(--danger);
      background: var(--danger-soft);
      border: 1px solid var(--danger-border);
      border-radius: var(--radius-sm);
      padding: 8px 10px;
      display: none;
    }

    .form-error.visible {
      display: block;
    }

    .confirm-message {
      font-size: 13.5px;
      color: var(--text-secondary);
      line-height: 1.55;
    }

    .confirm-details {
      margin-top: 10px;
      padding: 10px 12px;
      background: var(--bg-surface-subtle);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      font-size: 12.5px;
      color: var(--text-secondary);
    }

    /* Toast stack */
    .toast-stack {
      position: fixed;
      bottom: 20px;
      right: 20px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      z-index: 300;
      pointer-events: none;
    }

    .toast {
      pointer-events: auto;
      background: var(--bg-surface);
      color: var(--text-primary);
      border: 1px solid var(--border-strong);
      border-left-width: 3.5px;
      border-radius: var(--radius-sm);
      padding: 10px 14px;
      font-size: 13px;
      font-weight: 500;
      box-shadow: var(--shadow-md);
      display: flex;
      align-items: center;
      gap: 8px;
      max-width: 360px;
      animation: toastIn 160ms ease-out;
    }

    .toast.success { border-left-color: var(--success); }
    .toast.error { border-left-color: var(--danger); }
    .toast.info { border-left-color: var(--accent); }

    @keyframes toastIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Mobile sidebar overlay */
    .sidebar-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: var(--bg-overlay);
      z-index: 35;
    }

    /* =========================================================================
       RESPONSIVE BREAKPOINTS (DESKTOP-FIRST)
       ========================================================================= */
    @media (max-width: 1180px) {
      .kpi-grid,
      .sub-summary-strip {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
      .dashboard-grid,
      .calendar-layout {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 960px) {
      .kanban-board {
        grid-template-columns: 1fr;
      }
      .kanban-column {
        min-height: 160px;
      }
      .search-container {
        width: 220px;
      }
    }

    @media (max-width: 820px) {
      .mobile-menu-btn {
        display: inline-flex;
      }
      .sidebar {
        position: fixed;
        top: 0;
        bottom: 0;
        left: 0;
        transform: translateX(-100%);
        box-shadow: var(--shadow-lg);
      }
      .sidebar.open {
        transform: translateX(0);
      }
      .sidebar-overlay.open {
        display: block;
      }
      .topbar {
        padding: 0 14px;
      }
      .workspace {
        padding: 16px 14px 28px;
      }
      .page-subtitle {
        display: none;
      }
      .search-container {
        width: 170px;
      }
    }

    @media (max-width: 560px) {
      .kpi-grid,
      .sub-summary-strip,
      .form-row {
        grid-template-columns: 1fr;
      }
      .goals-grid {
        grid-template-columns: 1fr;
      }
      .cal-cell {
        min-height: 70px;
      }
    }
  </style>
</head>
<body>
  <div class="app-shell">

    <!-- Left Sidebar -->

        <button class="nav-item" data-view="kanban">

        <button class="nav-item" data-view="calendar">

        <button class="nav-item" data-view="subscriptions">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12a9 9 0 0 0-9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path>

            <path d="M3 12a9 9 0 0 0 9 9 9.75 9.75 0 0 0 6.74-2.74L21 16"></path>

      </nav>

      <!-- Unobtrusive Settings / Backup Footer -->
      <div class="sidebar-footer">
        <div class="backup-title">
          <span>Data Backup</span>
          <span>Local</span>
        </div>
        <div class="backup-actions">
          <button class="btn-backup" id="btnExportData" title="Export all data as JSON">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
              <polyline points="7 10 12 15 17 10"></polyline>
              <line x1="12" y1="15" x2="12" y2="3"></line>

            Export data
          </button>
          <button class="btn-backup" id="btnImportData" title="Import data from a backup JSON file">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
              <polyline points="17 8 12 3 7 8"></polyline>
              <line x1="12" y1="3" x2="12" y2="15"></line>

            Import data

    <!-- Main Content Column -->
    <div class="main-area">
      <header class="topbar">
        <div class="topbar-left">
          <button class="mobile-menu-btn" id="mobileMenuBtn" aria-label="Open menu">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
              <line x1="4" y1="6" x2="20" y2="6"></line>
              <line x1="4" y1="12" x2="20" y2="12"></line>
              <line x1="4" y1="18" x2="20" y2="18"></line>
            </svg>

        <div class="topbar-right">
          <!-- Global Search -->
          <div class="search-container" id="searchContainer">

  <!-- Form Modal -->
  <div class="modal-backdrop" id="formModalBackdrop" role="dialog" aria-modal="true" aria-labelledby="formModalTitle">

            <line x1="6" y1="6" x2="18" y2="18"></line>

        <div class="modal-footer" id="formModalFooter"></div>

      <div class="modal-header">
        <h2 class="modal-title" id="confirmModalTitle"></h2>

          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">

      <div class="modal-body" id="confirmModalBody"></div>
      <div class="modal-footer" id="confirmModalFooter"></div>

  <!-- Toast Notifications -->
  <div class="toast-stack" id="toastStack" aria-live="polite"></div>

  <script>
    (function () {
      'use strict';

      /* =======================================================================
         1. CONSTANTS & CONFIGURATION
         ======================================================================= */
      const APP_ID = 'personal-os-dashboard';
      const APP_VERSION = 1;
      const STORAGE_KEY = 'personal_os_dashboard_v1';

      const KANBAN_COLUMNS = [
        { id: 'todo', label: 'To Do', dotColor: 'var(--text-muted)' },
        { id: 'in-progress', label: 'In Progress', dotColor: 'var(--accent)' },
        { id: 'done', label: 'Done', dotColor: 'var(--success)' }
      ];

      const PRIORITIES = ['low', 'medium', 'high'];

      const SUBSCRIPTION_CATEGORIES = [
        'Entertainment',
        'Music',

        'Gaming',
        'News & Publications',
        'Productivity',
        'Cloud Storage',
        'Utilities',
        'Fitness & Health',
        'Shopping',
        'Finance',
        'Other'
      ];

      const SUBSCRIPTION_FREQUENCIES = [
        'Weekly',
        'Monthly',
        'Quarterly',
        'Yearly'
      ];

      const ICONS = {
        plus: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>',
        edit: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg>',
        trash: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"></path><path d="M10 11v6M14 11v6M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"></path></svg>',
        check: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>',
        sun: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"></path></svg>',
        moon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>',
        chevLeft: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>',
        chevRight: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>',
        clock: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>',
        alert: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>',
        calendar: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"></rect><path d="M16 2v4M8 2v4M3 10h18"></path></svg>',
        kanban: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"></rect><path d="M9 3v18M15 3v18"></path></svg>',
        repeat: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 0 0-9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path><path d="M3 3v5h5"></path><path d="M3 12a9 9 0 0 0 9 9 9.75 9.75 0 0 0 6.74-2.74L21 16"></path><path d="M16 16h5v5"></path></svg>',
        target: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"></circle><circle cx="12" cy="12" r="5"></circle><circle cx="12" cy="12" r="1.5" fill="currentColor"></circle></svg>'
      };

      /* =======================================================================
         2. APPLICATION STATE & LOCALSTORAGE PERSISTENCE
         ======================================================================= */
      function getDefaultTheme() {
        return (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
      }

      function createEmptyState() {
        return {
          settings: {
            theme: getDefaultTheme()
          },
          data: {
            kanban: [],
            calendar: [],
            subscriptions: [],
            goals: []
          }
        };
      }

      let appState = createEmptyState();

      // Transient UI state (not persisted in backup)
      const uiState = {
        activeView: 'dashboard',
        kanbanPriorityFilter: 'all',
        calendarYear: new Date().getFullYear(),
        calendarMonth: new Date().getMonth(),
        calendarSelectedDate: null,
        calendarAgendaTab: 'upcoming', // 'upcoming' | 'selected' | 'all'
        subCategoryFilter: 'all',
        subSortBy: 'renewal', // 'renewal' | 'cost' | 'name'
        goalFilter: 'all', // 'all' | 'active' | 'completed'
        searchResults: [],
        searchActiveIndex: -1,
        draggedCardId: null
      };

      function loadState() {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          if (!raw) {
            appState = createEmptyState();
            return;
          }
          const parsed = JSON.parse(raw);
          const validation = validateBackupPayload(parsed, { allowMissingExportMeta: true });
          if (validation.valid) {
            appState = {
              settings: { theme: parsed.settings.theme },
              data: {
                kanban: parsed.data.kanban,
                calendar: parsed.data.calendar,
                subscriptions: parsed.data.subscriptions,
                goals: parsed.data.goals
              }
            };
          } else {
            appState = createEmptyState();
          }
        } catch (err) {
          appState = createEmptyState();
        }
      }

        try {
          const payload = {
            app: APP_ID,
            version: APP_VERSION,
            settings: { theme: appState.settings.theme },
            data: appState.data
          };
          localStorage.setItem(STORAGE_KEY, JSON.stringify(payload));
        } catch (err) {
          showToast('Unable to save to localStorage. Storage may be full or restricted.', 'error');

      /* =======================================================================
         3. DATE, MATH, FORMATTING & SAFETY UTILITIES
         ======================================================================= */
      function generateId() {
        if (window.crypto && typeof window.crypto.randomUUID === 'function') {
          return window.crypto.randomUUID();
        }
        return 'id_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 9);
      }

      function escapeHtml(str) {
        if (str === null || str === undefined) return '';
        return String(str)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#39;');
      }

      function roundClean(num) {
        return Math.round(num * 10000) / 10000;
      }

      function formatCurrency(amount) {
        return new Intl.NumberFormat('en-AU', {
          style: 'currency',
          currency: 'AUD',
          minimumFractionDigits: 2,
          maximumFractionDigits: 2
        }).format(Number(amount) || 0);
      }

      function formatNumber(num) {
        return new Intl.NumberFormat('en-AU', {
          maximumFractionDigits: 2
        }).format(roundClean(Number(num) || 0));
      }

      function getTodayDate() {
        const now = new Date();
        return new Date(now.getFullYear(), now.getMonth(), now.getDate());
      }

      function formatDateISO(date) {
        const y = date.getFullYear();
        const m = String(date.getMonth() + 1).padStart(2, '0');
        const d = String(date.getDate()).padStart(2, '0');
        return y + '-' + m + '-' + d;
      }

      function parseLocalDate(dateStr) {
        if (typeof dateStr !== 'string' || !/^\d{4}-\d{2}-\d{2}$/.test(dateStr)) return null;
        const parts = dateStr.split('-').map(Number);
        const date = new Date(parts[0], parts[1] - 1, parts[2]);
        if (date.getFullYear() !== parts[0] || date.getMonth() !== parts[1] - 1 || date.getDate() !== parts[2]) {
          return null;
        }
        return date;
      }

      function isValidDateString(str) {
        return parseLocalDate(str) !== null;
      }

      // DST-safe whole-day difference between two local midnight dates
      function diffDays(fromDate, toDate) {
        const utc1 = Date.UTC(fromDate.getFullYear(), fromDate.getMonth(), fromDate.getDate());
        const utc2 = Date.UTC(toDate.getFullYear(), toDate.getMonth(), toDate.getDate());
        return Math.round((utc2 - utc1) / 86400000);
      }

      function addDays(date, days) {
        return new Date(date.getFullYear(), date.getMonth(), date.getDate() + days);
      }

      // Anchored month arithmetic: clamps day to last day of target month without drifting
      function addMonthsAnchored(startYear, startMonth, startDay, monthsToAdd) {
        const totalMonths = startMonth + monthsToAdd;
        const targetYear = startYear + Math.floor(totalMonths / 12);
        const targetMonth = ((totalMonths % 12) + 12) % 12;
        const lastDay = new Date(targetYear, targetMonth + 1, 0).getDate();
        return new Date(targetYear, targetMonth, Math.min(startDay, lastDay));
      }

      function formatDisplayDate(dateStr, includeYear) {
        const d = typeof dateStr === 'string' ? parseLocalDate(dateStr) : dateStr;
        if (!d) return '';
        const today = getTodayDate();
        const showYear = includeYear !== undefined ? includeYear : d.getFullYear() !== today.getFullYear();
        return d.toLocaleDateString('en-AU', showYear
          ? { month: 'short', day: 'numeric', year: 'numeric' }
          : { month: 'short', day: 'numeric' }
        );
      }

      function formatRelativeDays(days) {
        if (days === 0) return 'Today';
        if (days === 1) return 'Tomorrow';
        if (days === -1) return 'Yesterday';
        if (days > 1) return 'In ' + days + ' days';
        return Math.abs(days) + ' days ago';
      }

      function getDueDateInfo(dueDateStr, isDone) {
        if (!dueDateStr) return null;
        const due = parseLocalDate(dueDateStr);
        if (!due) return null;
        const today = getTodayDate();
        const delta = diffDays(today, due);
        const shortDate = formatDisplayDate(due);

        if (isDone) {
          return {
            state: 'done',
            delta: delta,
            label: shortDate,
            badgeClass: 'badge-neutral'
          };
        }
        if (delta < 0) {
          return {
            state: 'overdue',
            delta: delta,
            label: 'Overdue · ' + shortDate,
            badgeClass: 'badge-overdue'
          };
        }
        if (delta === 0) {
          return {
            state: 'today',
            delta: 0,
            label: 'Due today',
            badgeClass: 'badge-today'
          };
        }
        return {
          state: 'upcoming',
          delta: delta,
          label: 'Upcoming · ' + shortDate,
          badgeClass: 'badge-upcoming'
        };
      }

      /**
       * Automatically computes next renewal date and status from startDate, frequency, and optional endDate.
       */
      function calculateSubscriptionRenewal(sub) {
        const today = getTodayDate();
        const start = parseLocalDate(sub.startDate);
        const end = sub.endDate ? parseLocalDate(sub.endDate) : null;

        if (!start) {
          return { status: 'ended', active: false, nextRenewal: null, daysUntil: null, renewingSoon: false };
        }

        if (end && diffDays(today, end) < 0) {
          return { status: 'ended', active: false, nextRenewal: null, daysUntil: null, renewingSoon: false, endDate: end };
        }

        let candidate;
        if (diffDays(today, start) >= 0) {
          candidate = start;
        } else {
          const sy = start.getFullYear();
          const sm = start.getMonth();
          const sd = start.getDate();

          if (sub.frequency === 'Weekly') {
            const elapsed = diffDays(start, today);
            let k = Math.max(0, Math.floor(elapsed / 7));
            candidate = addDays(start, k * 7);
            while (diffDays(today, candidate) < 0) {
              k++;
              candidate = addDays(start, k * 7);
            }
          } else {
            const stepMonths = sub.frequency === 'Monthly' ? 1 : (sub.frequency === 'Quarterly' ? 3 : 12);
            const monthDiff = (today.getFullYear() - sy) * 12 + (today.getMonth() - sm);
            let k = Math.max(0, Math.floor(monthDiff / stepMonths) - 1);
            candidate = addMonthsAnchored(sy, sm, sd, k * stepMonths);
            while (diffDays(today, candidate) < 0) {
              k++;
              candidate = addMonthsAnchored(sy, sm, sd, k * stepMonths);
            }
          }
        }

        // If the next calculated renewal falls past the endDate, the subscription is active but won't renew again
        if (end && diffDays(end, candidate) > 0) {
          return {
            status: 'ending',
            active: true,
            nextRenewal: null,
            daysUntil: null,
            daysUntilEnd: diffDays(today, end),
            renewingSoon: false,
            endDate: end
          };
        }

        const daysUntil = diffDays(today, candidate);
        return {
          status: 'active',
          active: true,
          nextRenewal: candidate,
          nextRenewalISO: formatDateISO(candidate),
          daysUntil: daysUntil,
          renewingSoon: daysUntil >= 0 && daysUntil <= 30,
          endDate: end
        };
      }

      function normalizeMonthlyCost(cost, frequency) {
        const c = Number(cost) || 0;
        switch (frequency) {
          case 'Weekly': return (c * 52) / 12;
          case 'Monthly': return c;
          case 'Quarterly': return c / 3;
          case 'Yearly': return c / 12;
          default: return c;
        }
      }

      function getTotalMonthlySubscriptionCost() {
        return appState.data.subscriptions.reduce(function (sum, sub) {
          const info = calculateSubscriptionRenewal(sub);
          return info.active ? sum + normalizeMonthlyCost(sub.cost, sub.frequency) : sum;
        }, 0);
      }

      function getGoalSmartStep(target) {
        if (target >= 1000) return 100;
        if (target >= 100) return 10;
        if (target >= 25) return 5;
        return null;
      }

      function highlightMatch(rawText, query) {
        const text = String(rawText || '');
        if (!query) return escapeHtml(text);
        const lowerText = text.toLowerCase();
        const lowerQuery = query.toLowerCase();
        const idx = lowerText.indexOf(lowerQuery);
        if (idx === -1) return escapeHtml(text);
        const before = text.slice(0, idx);
        const match = text.slice(idx, idx + query.length);
        const after = text.slice(idx + query.length);
        return escapeHtml(before) + '<mark class="search-mark">' + escapeHtml(match) + '</mark>' + escapeHtml(after);
      }

      /* =======================================================================
         4. TOASTS & MODAL SYSTEM
         ======================================================================= */
      function showToast(message, type) {
        const stack = document.getElementById('toastStack');
        const toast = document.createElement('div');
        toast.className = 'toast ' + (type || 'info');
        toast.textContent = message;
        stack.appendChild(toast);
        setTimeout(function () {
          toast.style.opacity = '0';
          toast.style.transform = 'translateY(6px)';
          toast.style.transition = 'opacity 180ms ease, transform 180ms ease';
          setTimeout(function () { toast.remove(); }, 190);
        }, 3200);
      }

      let currentFormSubmitHandler = null;

      function openFormModal(options) {
        const backdrop = document.getElementById('formModalBackdrop');
        const titleEl = document.getElementById('formModalTitle');
        const bodyEl = document.getElementById('formModalBody');
        const footerEl = document.getElementById('formModalFooter');

        titleEl.textContent = options.title;
        bodyEl.innerHTML = '<div class="form-error" id="modalFormError"></div>' + options.bodyHtml;
        footerEl.innerHTML =
          '<button type="button" class="btn btn-secondary" id="modalCancelBtn">Cancel</button>' +
          '<button type="submit" class="btn btn-primary">' + escapeHtml(options.submitLabel || 'Save') + '</button>';

        currentFormSubmitHandler = options.onSubmit;
        backdrop.classList.add('open');

        document.getElementById('modalCancelBtn').addEventListener('click', closeFormModal);

        requestAnimationFrame(function () {
          const firstInput = bodyEl.querySelector('input, select, textarea');
          if (firstInput) firstInput.focus();
        });
      }

      function setFormModalError(msg) {
        const errEl = document.getElementById('modalFormError');
        if (!errEl) return;
        if (msg) {
          errEl.textContent = msg;
          errEl.classList.add('visible');
        } else {
          errEl.textContent = '';
          errEl.classList.remove('visible');
        }
      }

      function closeFormModal() {
        document.getElementById('formModalBackdrop').classList.remove('open');
        currentFormSubmitHandler = null;
      }

      let currentConfirmHandler = null;

      function openConfirmModal(options) {
        const backdrop = document.getElementById('confirmModalBackdrop');
        const titleEl = document.getElementById('confirmModalTitle');
        const bodyEl = document.getElementById('confirmModalBody');
        const footerEl = document.getElementById('confirmModalFooter');

        titleEl.textContent = options.title;
        let bodyHtml = '<p class="confirm-message">' + escapeHtml(options.message) + '</p>';
        if (options.detailsHtml) {
          bodyHtml += '<div class="confirm-details">' + options.detailsHtml + '</div>';
        }
        bodyEl.innerHTML = bodyHtml;

        if (options.alertOnly) {
          footerEl.innerHTML = '<button type="button" class="btn btn-primary" id="confirmOkBtn">Close</button>';
          currentConfirmHandler = null;
          backdrop.classList.add('open');
          document.getElementById('confirmOkBtn').addEventListener('click', closeConfirmModal);
          requestAnimationFrame(function () {
            document.getElementById('confirmOkBtn').focus();
          });
          return;
        }

        const confirmClass = options.danger ? 'btn-danger' : 'btn-primary';
        footerEl.innerHTML =
          '<button type="button" class="btn btn-secondary" id="confirmCancelBtn">Cancel</button>' +
          '<button type="button" class="btn ' + confirmClass + '" id="confirmActionBtn">' + escapeHtml(options.confirmLabel || 'Confirm') + '</button>';

        currentConfirmHandler = options.onConfirm;
        backdrop.classList.add('open');

        document.getElementById('confirmCancelBtn').addEventListener('click', closeConfirmModal);
        document.getElementById('confirmActionBtn').addEventListener('click', function () {
          const fn = currentConfirmHandler;
          closeConfirmModal();
          if (typeof fn === 'function') fn();
        });

        requestAnimationFrame(function () {
          document.getElementById('confirmActionBtn').focus();
        });
      }

      function closeConfirmModal() {
        document.getElementById('confirmModalBackdrop').classList.remove('open');
        currentConfirmHandler = null;
      }

         5. NAVIGATION, HEADER & SIDEBAR BADGES

              target.scrollIntoView({ behavior: 'smooth', block: 'center' });
              target.classList.remove('flash-highlight');
              void target.offsetWidth;
              target.classList.add('flash-highlight');
            }
          });
        }
      }

        const todayFull = getTodayDate().toLocaleDateString('en-AU', {

        });
