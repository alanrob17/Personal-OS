      function renderSidebarBadges() {
        const today = getTodayDate();

        // Kanban badge: show overdue count in alert style, else active task count
        const activeCards = appState.data.kanban.filter(function (c) { return c.status !== 'done'; });
        const overdueCount = activeCards.filter(function (c) {
          const info = getDueDateInfo(c.dueDate, false);
          return info && info.state === 'overdue';
        }).length;
        const kbBadge = document.getElementById('navBadgeKanban');
        if (overdueCount > 0) {
          kbBadge.textContent = overdueCount + ' overdue';
          kbBadge.className = 'nav-badge alert';
        } else if (activeCards.length > 0) {
          kbBadge.textContent = String(activeCards.length);
          kbBadge.className = 'nav-badge';
        } else {
          kbBadge.textContent = '';
          kbBadge.className = 'nav-badge';
        }

        // Calendar badge: upcoming events count
        const upcomingEvents = appState.data.calendar.filter(function (ev) {
          const d = parseLocalDate(ev.date);
          return d && diffDays(today, d) >= 0;
        }).length;
        const calBadge = document.getElementById('navBadgeCalendar');
        calBadge.textContent = upcomingEvents > 0 ? String(upcomingEvents) : '';
        calBadge.className = 'nav-badge';

        // Subscriptions badge: highlight if renewing within 30 days
        const renewingSoonCount = appState.data.subscriptions.filter(function (sub) {
          return calculateSubscriptionRenewal(sub).renewingSoon;
        }).length;
        const subBadge = document.getElementById('navBadgeSubscriptions');
        if (renewingSoonCount > 0) {
          subBadge.textContent = renewingSoonCount + ' soon';
          subBadge.className = 'nav-badge warn';
        } else if (appState.data.subscriptions.length > 0) {
          subBadge.textContent = String(appState.data.subscriptions.length);
          subBadge.className = 'nav-badge';
        } else {
          subBadge.textContent = '';
          subBadge.className = 'nav-badge';
        }

        // Goals badge: active goals count
        const activeGoalsCount = appState.data.goals.filter(function (g) { return g.current < g.target; }).length;
        const goalBadge = document.getElementById('navBadgeGoals');
        goalBadge.textContent = activeGoalsCount > 0 ? String(activeGoalsCount) : '';
        goalBadge.className = 'nav-badge';
      }

      /* =======================================================================
         6. GLOBAL SEARCH
         ======================================================================= */
      function performSearch(query) {
        const q = query.trim().toLowerCase();
        if (!q) return [];
        const results = [];

        // Kanban titles & notes
        appState.data.kanban.forEach(function (card) {
          const inTitle = (card.title || '').toLowerCase().includes(q);
          const inNotes = (card.notes || '').toLowerCase().includes(q);
          if (inTitle || inNotes) {
            const col = KANBAN_COLUMNS.find(function (c) { return c.id === card.status; });
            results.push({
              section: 'kanban',
              sectionLabel: 'Kanban',
              id: card.id,
              title: card.title,
              meta: (col ? col.label : '') + ' · ' + capitalize(card.priority) + ' priority' + (card.notes ? ' — ' + card.notes : '')
            });
          }
        });

        // Calendar titles & notes
        appState.data.calendar.forEach(function (ev) {
          const inTitle = (ev.title || '').toLowerCase().includes(q);
          const inNotes = (ev.notes || '').toLowerCase().includes(q);
          if (inTitle || inNotes) {
            results.push({
              section: 'calendar',
              sectionLabel: 'Calendar',
              id: ev.id,
              date: ev.date,
              title: ev.title,
              meta: formatDisplayDate(ev.date, true) + (ev.notes ? ' — ' + ev.notes : '')
            });
          }
        });

        // Subscription names, categories & notes
        appState.data.subscriptions.forEach(function (sub) {
          const inName = (sub.name || '').toLowerCase().includes(q);
          const inCat = (sub.category || '').toLowerCase().includes(q);
          const inNotes = (sub.notes || '').toLowerCase().includes(q);
          if (inName || inCat || inNotes) {
            results.push({
              section: 'subscriptions',
              sectionLabel: 'Subscriptions',
              id: sub.id,
              title: sub.name,
              meta: sub.category + ' · ' + formatCurrency(sub.cost) + ' / ' + sub.frequency + (sub.notes ? ' — ' + sub.notes : '')
            });
          }
        });

        // Goal titles
        appState.data.goals.forEach(function (goal) {
          if ((goal.title || '').toLowerCase().includes(q)) {
            const pct = Math.min(100, Math.round((goal.current / goal.target) * 100));
            results.push({
              section: 'goals',
              sectionLabel: 'Goals',
              id: goal.id,
              title: goal.title,
              meta: formatNumber(goal.current) + ' / ' + formatNumber(goal.target) + ' (' + pct + '%)'
            });
          }
        });

        return results;
      }

      function renderSearchDropdown(rawQuery) {
        const container = document.getElementById('searchContainer');
        const dropdown = document.getElementById('searchDropdown');
        const trimmed = rawQuery.trim();

        container.classList.toggle('has-query', rawQuery.length > 0);

        if (!trimmed) {
          uiState.searchResults = [];
          uiState.searchActiveIndex = -1;
          dropdown.classList.remove('open');
          dropdown.innerHTML = '';
          return;
        }

        const results = performSearch(trimmed);
        uiState.searchResults = results;
        uiState.searchActiveIndex = results.length > 0 ? 0 : -1;

        if (results.length === 0) {
          dropdown.innerHTML = '<div class="search-empty">No results found for "' + escapeHtml(trimmed) + '"</div>';
          dropdown.classList.add('open');
          return;
        }

        let html =
          '<div class="search-dropdown-header">' +
            '<span>Search Results</span>' +
            '<span>' + results.length + (results.length === 1 ? ' match' : ' matches') + '</span>' +
          '</div>';

        results.forEach(function (res, idx) {
          html +=
            '<button type="button" class="search-result-item' + (idx === uiState.searchActiveIndex ? ' active' : '') + '" data-search-idx="' + idx + '">' +
              '<span class="search-section-tag ' + res.section + '">' + escapeHtml(res.sectionLabel) + '</span>' +
              '<div class="search-result-body">' +
                '<div class="search-result-title">' + highlightMatch(res.title, trimmed) + '</div>' +
                '<div class="search-result-meta">' + highlightMatch(res.meta, trimmed) + '</div>' +
              '</div>' +
            '</button>';
        });

        dropdown.innerHTML = html;
        dropdown.classList.add('open');
      }

      function selectSearchResult(idx) {
        const res = uiState.searchResults[idx];
        if (!res) return;

        const input = document.getElementById('globalSearchInput');
        input.value = '';
        renderSearchDropdown('');
        input.blur();

        if (res.section === 'kanban') {
          uiState.kanbanPriorityFilter = 'all';
          setActiveView('kanban', { highlightSelector: '[data-card-id="' + res.id + '"]' });
        } else if (res.section === 'calendar') {
          const d = parseLocalDate(res.date);
          if (d) {
            uiState.calendarYear = d.getFullYear();
            uiState.calendarMonth = d.getMonth();
            uiState.calendarSelectedDate = res.date;
            uiState.calendarAgendaTab = 'selected';
          }
          setActiveView('calendar', { highlightSelector: '[data-event-id="' + res.id + '"]' });
        } else if (res.section === 'subscriptions') {
          uiState.subCategoryFilter = 'all';
          setActiveView('subscriptions', { highlightSelector: '[data-sub-id="' + res.id + '"]' });
        } else if (res.section === 'goals') {
          uiState.goalFilter = 'all';
          setActiveView('goals', { highlightSelector: '[data-goal-id="' + res.id + '"]' });
        }
      }

      /* =======================================================================
         7. VIEW RENDERERS
         ======================================================================= */
      function render() {
        renderHeader();
        renderSidebarBadges();

        const root = document.getElementById('viewRoot');
        switch (uiState.activeView) {
          case 'dashboard': renderDashboard(root); break;
          case 'kanban': renderKanban(root); break;
          case 'calendar': renderCalendar(root); break;
          case 'subscriptions': renderSubscriptions(root); break;
          case 'goals': renderGoals(root); break;
          default: renderDashboard(root);
        }
      }

      function capitalize(str) {
        return str ? str.charAt(0).toUpperCase() + str.slice(1) : '';
      }

      /* -----------------------------------------------------------------------
         7A. DASHBOARD VIEW
         ----------------------------------------------------------------------- */
      function renderDashboard(root) {
        const today = getTodayDate();

        // Metrics
        const todoCards = appState.data.kanban.filter(function (c) { return c.status === 'todo'; });
        const progressCards = appState.data.kanban.filter(function (c) { return c.status === 'in-progress'; });
        const doneCards = appState.data.kanban.filter(function (c) { return c.status === 'done'; });
        const activeCards = todoCards.concat(progressCards);

        const upcomingEvents = appState.data.calendar
          .map(function (ev) {
            const d = parseLocalDate(ev.date);
            return { event: ev, date: d, delta: d ? diffDays(today, d) : -9999 };
          })
          .filter(function (item) { return item.date && item.delta >= 0; })
          .sort(function (a, b) {
            if (a.delta !== b.delta) return a.delta - b.delta;
            return a.event.title.localeCompare(b.event.title);
          });

        const activeGoals = appState.data.goals.filter(function (g) { return g.current < g.target; });
        const completedGoalsCount = appState.data.goals.length - activeGoals.length;

        const monthlyCost = getTotalMonthlySubscriptionCost();
        const activeSubsCount = appState.data.subscriptions.filter(function (s) {
          return calculateSubscriptionRenewal(s).active;
        }).length;

        // Actionable due & overdue Kanban items (overdue, due today, or due within 7 days)
        const attentionTasks = activeCards
          .map(function (card) {
            return { card: card, due: getDueDateInfo(card.dueDate, false) };
          })
          .filter(function (item) {
            return item.due && item.due.delta <= 7;
          })
          .sort(function (a, b) {
            if (a.due.delta !== b.due.delta) return a.due.delta - b.due.delta;
            const pOrder = { high: 0, medium: 1, low: 2 };
            return pOrder[a.card.priority] - pOrder[b.card.priority];
          });

        const overdueCount = attentionTasks.filter(function (t) { return t.due.state === 'overdue'; }).length;
        const dueTodayCount = attentionTasks.filter(function (t) { return t.due.state === 'today'; }).length;

        // Upcoming subscription renewals (within next 30 days)
        const upcomingRenewals = appState.data.subscriptions
          .map(function (sub) {
            return { sub: sub, renewal: calculateSubscriptionRenewal(sub) };
          })
          .filter(function (item) { return item.renewal.renewingSoon; })
          .sort(function (a, b) { return a.renewal.daysUntil - b.renewal.daysUntil; });

        // Kanban summary percentages
        const totalCards = appState.data.kanban.length;
        const todoPct = totalCards ? (todoCards.length / totalCards) * 100 : 0;
        const progPct = totalCards ? (progressCards.length / totalCards) * 100 : 0;
        const donePct = totalCards ? (doneCards.length / totalCards) * 100 : 0;
        const highPriorityActive = activeCards.filter(function (c) { return c.priority === 'high'; }).length;

        // Sort goals for dashboard overview: active first (by closest deadline or highest % progress), then completed
        const dashboardGoals = appState.data.goals.slice().sort(function (a, b) {
          const aDone = a.current >= a.target ? 1 : 0;
          const bDone = b.current >= b.target ? 1 : 0;
          if (aDone !== bDone) return aDone - bDone;
          if (a.deadline && b.deadline) return a.deadline.localeCompare(b.deadline);
          if (a.deadline) return -1;
          if (b.deadline) return 1;
          return (b.current / b.target) - (a.current / a.target);
        });

        let html = '';

        // Quick-glance KPI row
        html += '<section class="kpi-grid" aria-label="Quick overview">';
        html +=
          '<button class="kpi-card" data-jump="kanban">' +
            '<div class="kpi-meta">' +
              '<div class="kpi-label">Active Tasks</div>' +
              '<div class="kpi-value">' + activeCards.length + '</div>' +
              '<div class="kpi-sub">' + (overdueCount > 0 ? overdueCount + ' overdue' : (dueTodayCount > 0 ? dueTodayCount + ' due today' : 'On track')) + '</div>' +
            '</div>' +
            '<div class="kpi-icon blue">' + ICONS.kanban + '</div>' +
          '</button>';

        html +=
          '<button class="kpi-card" data-jump="calendar">' +
            '<div class="kpi-meta">' +
              '<div class="kpi-label">Upcoming Events</div>' +
              '<div class="kpi-value">' + upcomingEvents.length + '</div>' +
              '<div class="kpi-sub">' + (upcomingEvents.length > 0 ? 'Next: ' + formatRelativeDays(upcomingEvents[0].delta) : 'Nothing scheduled') + '</div>' +
            '</div>' +
            '<div class="kpi-icon purple">' + ICONS.calendar + '</div>' +
          '</button>';

        html +=
          '<button class="kpi-card" data-jump="goals">' +
            '<div class="kpi-meta">' +
              '<div class="kpi-label">Active Goals</div>' +
              '<div class="kpi-value">' + activeGoals.length + '</div>' +
              '<div class="kpi-sub">' + completedGoalsCount + ' completed</div>' +
            '</div>' +
            '<div class="kpi-icon green">' + ICONS.target + '</div>' +
          '</button>';

        html +=
          '<button class="kpi-card" data-jump="subscriptions">' +
            '<div class="kpi-meta">' +
              '<div class="kpi-label">Monthly Subscriptions</div>' +
              '<div class="kpi-value">' + formatCurrency(monthlyCost) + '</div>' +
              '<div class="kpi-sub">' + activeSubsCount + ' active · ' + upcomingRenewals.length + ' renewing soon</div>' +
            '</div>' +
            '<div class="kpi-icon amber">' + ICONS.repeat + '</div>' +
          '</button>';
        html += '</section>';

        // Main 2-column actionable layout
        html += '<div class="dashboard-grid">';

        // LEFT COLUMN
        html += '<div class="dashboard-col">';

        // 1. Due & Overdue Kanban Items
        html += '<section class="panel">';
        html +=
          '<div class="panel-header">' +
            '<div class="panel-title-group">' +
              '<h2 class="panel-title">Due &amp; Overdue Tasks</h2>' +
              '<span class="panel-count">' + attentionTasks.length + '</span>' +
            '</div>' +
            '<button class="panel-link" data-jump="kanban">Open Kanban</button>' +
          '</div>';
        html += '<div class="panel-body">';
        if (attentionTasks.length === 0) {
          html +=
            '<div class="empty-state">' +
              '<div class="empty-state-icon">' + ICONS.check + '</div>' +
              '<div class="empty-state-title">No urgent deadlines</div>' +
              '<div class="empty-state-desc">No overdue tasks or items due within the next 7 days.</div>' +
            '</div>';
        } else {
          html += '<div class="action-list">';
          attentionTasks.forEach(function (item) {
            const c = item.card;
            const colLabel = c.status === 'in-progress' ? 'In Progress' : 'To Do';
            html +=
              '<div class="action-row">' +
                '<button class="quick-check" data-dash-complete-card="' + c.id + '" title="Mark as Done" aria-label="Mark ' + escapeHtml(c.title) + ' as done">' + ICONS.check + '</button>' +
                '<div class="action-row-main" data-dash-edit-card="' + c.id + '">' +
                  '<div class="action-row-title">' + escapeHtml(c.title) + '</div>' +
                  '<div class="action-row-sub">' + colLabel + (c.notes ? ' · ' + escapeHtml(c.notes) : '') + '</div>' +
                '</div>' +
                '<div class="action-row-right">' +
                  '<span class="badge badge-' + c.priority + '">' + capitalize(c.priority) + '</span>' +
                  '<span class="badge ' + item.due.badgeClass + '">' + escapeHtml(item.due.label) + '</span>' +
                '</div>' +
              '</div>';
          });
          html += '</div>';
        }
        html += '</div></section>';

        // 2. Goal Progress Overview
        html += '<section class="panel">';
        html +=
          '<div class="panel-header">' +
            '<div class="panel-title-group">' +
              '<h2 class="panel-title">Goal Progress Overview</h2>' +
              '<span class="panel-count">' + appState.data.goals.length + '</span>' +
            '</div>' +
            '<button class="panel-link" data-jump="goals">Manage Goals</button>' +
          '</div>';
        html += '<div class="panel-body">';
        if (dashboardGoals.length === 0) {
          html +=
            '<div class="empty-state">' +
              '<div class="empty-state-icon">' + ICONS.target + '</div>' +
              '<div class="empty-state-title">No goals set yet</div>' +
              '<div class="empty-state-desc">Track measurable milestones toward your long-term objectives.</div>' +
              '<button class="btn btn-secondary btn-sm" id="dashAddGoalBtn">' + ICONS.plus + 'Add Goal</button>' +
            '</div>';
        } else {
          dashboardGoals.slice(0, 5).forEach(function (goal) {
            const pct = Math.min(100, Math.round((goal.current / goal.target) * 100));
            const remaining = Math.max(0, roundClean(goal.target - goal.current));
            const isCompleted = goal.current >= goal.target;
            html +=
              '<div class="dash-goal-item">' +
                '<div class="dash-goal-top">' +
                  '<div class="dash-goal-title" data-dash-edit-goal="' + goal.id + '">' + escapeHtml(goal.title) + '</div>' +
                  '<div class="dash-goal-stats">' +
                    '<span>' + formatNumber(goal.current) + ' / ' + formatNumber(goal.target) + '</span>' +
                    (isCompleted
                      ? '<span class="badge badge-done">Completed</span>'
                      : '<span>' + formatNumber(remaining) + ' left</span>' +
                        '<button class="btn-step" data-quick-goal-id="' + goal.id + '" data-quick-goal-delta="1" title="Add 1 to progress">+1</button>'
                    ) +
                  '</div>' +
                '</div>' +
                '<div class="progress-track">' +
                  '<div class="progress-fill' + (isCompleted ? ' completed' : '') + '" style="width:' + pct + '%"></div>' +
                '</div>' +
              '</div>';
          });
        }
        html += '</div></section>';

        // 3. Kanban Summary
        html += '<section class="panel">';
        html +=
          '<div class="panel-header">' +
            '<div class="panel-title-group">' +
              '<h2 class="panel-title">Kanban Summary</h2>' +
              (highPriorityActive > 0 ? '<span class="badge badge-high">' + highPriorityActive + ' High Priority</span>' : '') +
            '</div>' +
            '<button class="panel-link" data-jump="kanban">View Board</button>' +
          '</div>';
        html += '<div class="panel-body">';
        html +=
          '<div class="kanban-summary-bar" title="Board distribution">' +
            '<div class="ks-seg-todo" style="width:' + todoPct + '%"></div>' +
            '<div class="ks-seg-progress" style="width:' + progPct + '%"></div>' +
            '<div class="ks-seg-done" style="width:' + donePct + '%"></div>' +
          '</div>';
        html +=
          '<div class="kanban-summary-cols">' +
            '<div class="ks-stat" data-jump="kanban">' +
              '<div class="ks-stat-head"><span class="ks-dot" style="background:var(--text-muted)"></span>To Do</div>' +
              '<div class="ks-stat-num">' + todoCards.length + '</div>' +
            '</div>' +
            '<div class="ks-stat" data-jump="kanban">' +
              '<div class="ks-stat-head"><span class="ks-dot" style="background:var(--accent)"></span>In Progress</div>' +
              '<div class="ks-stat-num">' + progressCards.length + '</div>' +
            '</div>' +
            '<div class="ks-stat" data-jump="kanban">' +
              '<div class="ks-stat-head"><span class="ks-dot" style="background:var(--success)"></span>Done</div>' +
              '<div class="ks-stat-num">' + doneCards.length + '</div>' +
            '</div>' +
          '</div>';
        html += '</div></section>';

        html += '</div>'; // end left col

        // RIGHT COLUMN
        html += '<div class="dashboard-col">';

        // 4. Upcoming Events
        html += '<section class="panel">';
        html +=
          '<div class="panel-header">' +
            '<div class="panel-title-group">' +
              '<h2 class="panel-title">Upcoming Events</h2>' +
              '<span class="panel-count">' + upcomingEvents.length + '</span>' +
            '</div>' +
            '<button class="panel-link" data-jump="calendar">Open Calendar</button>' +
          '</div>';
        html += '<div class="panel-body">';
        if (upcomingEvents.length === 0) {
          html +=
            '<div class="empty-state">' +
              '<div class="empty-state-icon">' + ICONS.calendar + '</div>' +
              '<div class="empty-state-title">No upcoming events</div>' +
              '<div class="empty-state-desc">Add appointments, birthdays, holidays, or scheduled events.</div>' +
              '<button class="btn btn-secondary btn-sm" id="dashAddEventBtn">' + ICONS.plus + 'Add Event</button>' +
            '</div>';
        } else {
          html += '<div class="action-list">';
          upcomingEvents.slice(0, 7).forEach(function (item) {
            const ev = item.event;
            const badgeClass = item.delta === 0 ? 'badge-today' : 'badge-upcoming';
            html +=
              '<div class="action-row">' +
                '<div class="action-row-main" data-dash-edit-event="' + ev.id + '">' +
                  '<div class="action-row-title">' + escapeHtml(ev.title) + '</div>' +
                  '<div class="action-row-sub">' + formatDisplayDate(item.date) + (ev.notes ? ' · ' + escapeHtml(ev.notes) : '') + '</div>' +
                '</div>' +
                '<div class="action-row-right">' +
                  '<span class="badge ' + badgeClass + '">' + formatRelativeDays(item.delta) + '</span>' +
                '</div>' +
              '</div>';
          });
          html += '</div>';
        }
        html += '</div></section>';

        // 5. Upcoming Subscription Renewals (next 30 days)
        html += '<section class="panel">';
        html +=
          '<div class="panel-header">' +
            '<div class="panel-title-group">' +
              '<h2 class="panel-title">Upcoming Renewals</h2>' +
              '<span class="panel-count">' + upcomingRenewals.length + '</span>' +
            '</div>' +
            '<button class="panel-link" data-jump="subscriptions">All Subscriptions</button>' +
          '</div>';
        html += '<div class="panel-body">';
        if (upcomingRenewals.length === 0) {
          html +=
            '<div class="empty-state">' +
              '<div class="empty-state-icon">' + ICONS.repeat + '</div>' +
              '<div class="empty-state-title">No renewals in the next 30 days</div>' +
              '<div class="empty-state-desc">Subscriptions renewing within 30 days will be highlighted here.</div>' +
            '</div>';
        } else {
          html += '<div class="action-list">';
          upcomingRenewals.forEach(function (item) {
            const sub = item.sub;
            const r = item.renewal;
            const dueLabel = r.daysUntil === 0 ? 'Today' : (r.daysUntil === 1 ? 'Tomorrow' : 'In ' + r.daysUntil + 'd');
            html +=
              '<div class="action-row">' +
                '<div class="action-row-main" data-dash-edit-sub="' + sub.id + '">' +
                  '<div class="action-row-title">' + escapeHtml(sub.name) + '</div>' +
                  '<div class="action-row-sub">' + escapeHtml(sub.category) + ' · ' + formatDisplayDate(r.nextRenewal) + '</div>' +
                '</div>' +
                '<div class="action-row-right">' +
                  '<span class="tabular-nums" style="font-weight:600;font-size:13px">' + formatCurrency(sub.cost) + '</span>' +
                  '<span class="badge badge-today">' + dueLabel + '</span>' +
                '</div>' +
              '</div>';
          });
          html += '</div>';
        }
        html += '</div></section>';

        html += '</div>'; // end right col
        html += '</div>'; // end dashboard-grid

        root.innerHTML = html;

        // Bind Dashboard interactions
        root.querySelectorAll('[data-jump]').forEach(function (el) {
          el.addEventListener('click', function () { setActiveView(el.dataset.jump); });
        });

        root.querySelectorAll('[data-dash-complete-card]').forEach(function (btn) {
          btn.addEventListener('click', function () {
            const card = appState.data.kanban.find(function (c) { return c.id === btn.dataset.dashCompleteCard; });
            if (!card) return;
            card.status = 'done';
            saveState();
            render();
            showToast('Moved "' + card.title + '" to Done', 'success');
          });
        });

        root.querySelectorAll('[data-dash-edit-card]').forEach(function (el) {
          el.addEventListener('click', function () {
            const card = appState.data.kanban.find(function (c) { return c.id === el.dataset.dashEditCard; });
            if (card) openKanbanModal(card);
          });
        });

        root.querySelectorAll('[data-dash-edit-event]').forEach(function (el) {
          el.addEventListener('click', function () {
            const ev = appState.data.calendar.find(function (e) { return e.id === el.dataset.dashEditEvent; });
            if (ev) openCalendarModal(ev);
          });
        });

        root.querySelectorAll('[data-dash-edit-sub]').forEach(function (el) {
          el.addEventListener('click', function () {
            const sub = appState.data.subscriptions.find(function (s) { return s.id === el.dataset.dashEditSub; });
            if (sub) openSubscriptionModal(sub);
          });
        });

        root.querySelectorAll('[data-dash-edit-goal]').forEach(function (el) {
          el.addEventListener('click', function () {
            const goal = appState.data.goals.find(function (g) { return g.id === el.dataset.dashEditGoal; });
            if (goal) openGoalModal(goal);
          });
        });

        root.querySelectorAll('[data-quick-goal-id]').forEach(function (btn) {
          btn.addEventListener('click', function () {
            updateGoalProgress(btn.dataset.quickGoalId, Number(btn.dataset.quickGoalDelta));
          });
        });

        const addGoalBtn = document.getElementById('dashAddGoalBtn');
        if (addGoalBtn) addGoalBtn.addEventListener('click', function () { openGoalModal(null); });

        const addEventBtn = document.getElementById('dashAddEventBtn');
        if (addEventBtn) addEventBtn.addEventListener('click', function () { openCalendarModal(null, formatDateISO(getTodayDate())); });
      }

      /* -----------------------------------------------------------------------
         7B. KANBAN VIEW & DRAG-AND-DROP
         ----------------------------------------------------------------------- */
      function renderKanban(root) {
        const filter = uiState.kanbanPriorityFilter;
        const filteredCards = appState.data.kanban.filter(function (c) {
          return filter === 'all' || c.priority === filter;
        });

        let html =
          '<div class="section-toolbar">' +
            '<div class="filter-pills" role="group" aria-label="Filter by priority">' +
              ['all', 'high', 'medium', 'low'].map(function (p) {
                const label = p === 'all' ? 'All Priorities' : capitalize(p);
                return '<button class="filter-pill' + (filter === p ? ' active' : '') + '" data-kanban-filter="' + p + '">' + label + '</button>';
              }).join('') +
            '</div>' +
            '<span style="font-size:12.5px;color:var(--text-muted)">Drag cards between columns to update status</span>' +
          '</div>';

        html += '<div class="kanban-board">';
        KANBAN_COLUMNS.forEach(function (col) {
          const cards = filteredCards.filter(function (c) { return c.status === col.id; });
          html +=
            '<section class="kanban-column" data-column-status="' + col.id + '">' +
              '<div class="kanban-col-header">' +
                '<div class="kanban-col-title-wrap">' +
                  '<span class="ks-dot" style="background:' + col.dotColor + '"></span>' +
                  '<h2 class="kanban-col-title">' + col.label + '</h2>' +
                  '<span class="panel-count">' + cards.length + '</span>' +
                '</div>' +
                '<button class="icon-action" data-add-in-col="' + col.id + '" title="Add card to ' + col.label + '" aria-label="Add card to ' + col.label + '">' + ICONS.plus + '</button>' +
              '</div>' +
              '<div class="kanban-col-body" data-drop-list="' + col.id + '">';

          if (cards.length === 0) {
            html += '<div class="kanban-empty-col">No cards in ' + col.label + '</div>';
          } else {
            cards.forEach(function (card) {
              const isDone = card.status === 'done';
              const due = getDueDateInfo(card.dueDate, isDone);
              html +=
                '<article class="kanban-card priority-' + card.priority + (isDone ? ' is-done' : '') + '" draggable="true" data-card-id="' + card.id + '">' +
                  '<div class="kanban-card-top">' +
                    '<div class="kanban-card-title">' + escapeHtml(card.title) + '</div>' +
                    '<div class="kanban-card-actions">' +
                      '<button type="button" class="icon-action" data-edit-card="' + card.id + '" title="Edit card" aria-label="Edit card">' + ICONS.edit + '</button>' +
                      '<button type="button" class="icon-action delete" data-delete-card="' + card.id + '" title="Delete card" aria-label="Delete card">' + ICONS.trash + '</button>' +
                    '</div>' +
                  '</div>' +
                  (card.notes ? '<div class="kanban-card-notes">' + escapeHtml(card.notes) + '</div>' : '') +
                  '<div class="kanban-card-footer">' +
                    '<span class="badge badge-' + card.priority + '">' + capitalize(card.priority) + '</span>' +
                    (due ? '<span class="badge ' + due.badgeClass + '">' + (due.state === 'overdue' ? ICONS.alert : ICONS.clock) + escapeHtml(due.label) + '</span>' : '') +
                  '</div>' +
                '</article>';
            });
          }

          html += '</div></section>';
        });
        html += '</div>';

        root.innerHTML = html;

        // Priority filter
        root.querySelectorAll('[data-kanban-filter]').forEach(function (btn) {
          btn.addEventListener('click', function () {
            uiState.kanbanPriorityFilter = btn.dataset.kanbanFilter;
            renderKanban(root);
          });
        });

        // Add card in specific column
        root.querySelectorAll('[data-add-in-col]').forEach(function (btn) {
          btn.addEventListener('click', function () {
            openKanbanModal(null, btn.dataset.addInCol);
          });
        });

        // Edit & delete card
        root.querySelectorAll('[data-edit-card]').forEach(function (btn) {
          btn.addEventListener('click', function (e) {
            e.stopPropagation();
            const card = appState.data.kanban.find(function (c) { return c.id === btn.dataset.editCard; });
            if (card) openKanbanModal(card);
          });
        });

        root.querySelectorAll('[data-delete-card]').forEach(function (btn) {
          btn.addEventListener('click', function (e) {
            e.stopPropagation();
            const card = appState.data.kanban.find(function (c) { return c.id === btn.dataset.deleteCard; });
            if (!card) return;
            openConfirmModal({
              title: 'Delete Card',
              message: 'Are you sure you want to delete "' + card.title + '"? This action cannot be undone.',
              confirmLabel: 'Delete',
              danger: true,
              onConfirm: function () {
                appState.data.kanban = appState.data.kanban.filter(function (c) { return c.id !== card.id; });
                saveState();
                render();
                showToast('Card deleted', 'info');
              }
            });
          });
        });

        // Bind Drag & Drop
        bindKanbanDragAndDrop(root);
      }

      function bindKanbanDragAndDrop(root) {
        function clearDropHints() {
          root.querySelectorAll('.kanban-column').forEach(function (col) { col.classList.remove('is-drag-over'); });
          root.querySelectorAll('.kanban-card').forEach(function (c) {
            c.classList.remove('drop-before', 'drop-after');
          });
        }

        root.querySelectorAll('.kanban-card').forEach(function (cardEl) {
          cardEl.addEventListener('dragstart', function (e) {
            uiState.draggedCardId = cardEl.dataset.cardId;
            e.dataTransfer.effectAllowed = 'move';
            e.dataTransfer.setData('text/plain', cardEl.dataset.cardId);
            requestAnimationFrame(function () {
              cardEl.classList.add('is-dragging');
            });
          });

          cardEl.addEventListener('dragend', function () {
            uiState.draggedCardId = null;
            cardEl.classList.remove('is-dragging');
            clearDropHints();
          });

          cardEl.addEventListener('dragover', function (e) {
            if (!uiState.draggedCardId || uiState.draggedCardId === cardEl.dataset.cardId) return;
            e.preventDefault();
            e.dataTransfer.dropEffect = 'move';
            const rect = cardEl.getBoundingClientRect();
            const isTopHalf = e.clientY < rect.top + rect.height / 2;
            root.querySelectorAll('.kanban-card').forEach(function (c) {
              if (c !== cardEl) c.classList.remove('drop-before', 'drop-after');
            });
            cardEl.classList.toggle('drop-before', isTopHalf);
            cardEl.classList.toggle('drop-after', !isTopHalf);
          });

          cardEl.addEventListener('drop', function (e) {
            e.preventDefault();
            e.stopPropagation();
            const draggedId = uiState.draggedCardId || e.dataTransfer.getData('text/plain');
            const targetId = cardEl.dataset.cardId;
            const colEl = cardEl.closest('.kanban-column');
            if (!draggedId || !colEl) return;

            const rect = cardEl.getBoundingClientRect();
            const insertBefore = e.clientY < rect.top + rect.height / 2;
            moveKanbanCard(draggedId, colEl.dataset.columnStatus, targetId, insertBefore);
          });
        });

        root.querySelectorAll('.kanban-column').forEach(function (colEl) {
          colEl.addEventListener('dragover', function (e) {
            if (!uiState.draggedCardId) return;
            e.preventDefault();
            e.dataTransfer.dropEffect = 'move';
            colEl.classList.add('is-drag-over');
          });

          colEl.addEventListener('dragleave', function (e) {
            if (!colEl.contains(e.relatedTarget)) {
              colEl.classList.remove('is-drag-over');
            }
          });

          colEl.addEventListener('drop', function (e) {
            e.preventDefault();
            const draggedId = uiState.draggedCardId || e.dataTransfer.getData('text/plain');
            if (!draggedId) return;
            moveKanbanCard(draggedId, colEl.dataset.columnStatus, null, false);
          });
        });
      }

      function moveKanbanCard(cardId, newStatus, targetCardId, insertBefore) {
        const list = appState.data.kanban;
        const fromIdx = list.findIndex(function (c) { return c.id === cardId; });
        if (fromIdx === -1) return;

        const card = list.splice(fromIdx, 1)[0];
        card.status = newStatus;

        if (targetCardId && targetCardId !== cardId) {
          const targetIdx = list.findIndex(function (c) { return c.id === targetCardId; });
          if (targetIdx !== -1) {
            list.splice(insertBefore ? targetIdx : targetIdx + 1, 0, card);
          } else {
            list.push(card);
          }
        } else {
          list.push(card);
        }

        saveState();
        render();
      }

      function openKanbanModal(card, defaultStatus) {
        const isEdit = Boolean(card);
        const statusVal = isEdit ? card.status : (defaultStatus || 'todo');
        const priorityVal = isEdit ? card.priority : 'medium';

        const bodyHtml =
          '<div class="form-field">' +
            '<label class="form-label" for="kbTitle">Title <span class="req">*</span></label>' +
            '<input id="kbTitle" class="form-input" type="text" maxlength="140" value="' + escapeHtml(isEdit ? card.title : '') + '" placeholder="What needs to be done?">' +
          '</div>' +
          '<div class="form-row">' +
            '<div class="form-field">' +
              '<label class="form-label" for="kbStatus">Column</label>' +
              '<select id="kbStatus" class="form-select">' +
                KANBAN_COLUMNS.map(function (col) {
                  return '<option value="' + col.id + '"' + (statusVal === col.id ? ' selected' : '') + '>' + col.label + '</option>';
                }).join('') +
              '</select>' +
            '</div>' +
            '<div class="form-field">' +
              '<label class="form-label" for="kbPriority">Priority</label>' +
              '<select id="kbPriority" class="form-select">' +
                PRIORITIES.map(function (p) {
                  return '<option value="' + p + '"' + (priorityVal === p ? ' selected' : '') + '>' + capitalize(p) + '</option>';
                }).join('') +
              '</select>' +
            '</div>' +
          '</div>' +
          '<div class="form-field">' +
            '<label class="form-label" for="kbDueDate">Due Date (optional)</label>' +
            '<input id="kbDueDate" class="form-input" type="date" value="' + escapeHtml(isEdit ? (card.dueDate || '') : '') + '">' +
          '</div>' +
          '<div class="form-field">' +
            '<label class="form-label" for="kbNotes">Notes</label>' +
            '<textarea id="kbNotes" class="form-textarea" placeholder="Add context, steps, or details...">' + escapeHtml(isEdit ? (card.notes || '') : '') + '</textarea>' +
          '</div>';

        openFormModal({
          title: isEdit ? 'Edit Kanban Card' : 'New Kanban Card',
          submitLabel: isEdit ? 'Save Changes' : 'Create Card',
          bodyHtml: bodyHtml,
          onSubmit: function () {
            const title = document.getElementById('kbTitle').value.trim();
            const status = document.getElementById('kbStatus').value;
            const priority = document.getElementById('kbPriority').value;
            const dueDate = document.getElementById('kbDueDate').value.trim();
            const notes = document.getElementById('kbNotes').value.trim();

            if (!title) {
              setFormModalError('Please enter a card title.');
              return;
            }
            if (dueDate && !isValidDateString(dueDate)) {
              setFormModalError('Please enter a valid due date.');
              return;
            }

            if (isEdit) {
              card.title = title;
              card.status = status;
              card.priority = priority;
              card.dueDate = dueDate;
              card.notes = notes;
              showToast('Card updated', 'success');
            } else {
              appState.data.kanban.push({
                id: generateId(),
                title: title,
                notes: notes,
                priority: priority,
                dueDate: dueDate,
                status: status
              });
              showToast('Card created', 'success');
            }

            saveState();
            closeFormModal();
            render();
          }
        });
      }

      /* -----------------------------------------------------------------------
         7C. CALENDAR VIEW (MONTH GRID + CHRONOLOGICAL AGENDA)
         ----------------------------------------------------------------------- */
      function renderCalendar(root) {
        const today = getTodayDate();
        const todayISO = formatDateISO(today);
        const year = uiState.calendarYear;
        const month = uiState.calendarMonth;

        // Map events by YYYY-MM-DD
        const eventsByDate = {};
        appState.data.calendar.forEach(function (ev) {
          if (!eventsByDate[ev.date]) eventsByDate[ev.date] = [];
          eventsByDate[ev.date].push(ev);
        });
        Object.keys(eventsByDate).forEach(function (k) {
          eventsByDate[k].sort(function (a, b) { return a.title.localeCompare(b.title); });
        });

        const firstOfMonth = new Date(year, month, 1);
        const monthLabel = firstOfMonth.toLocaleDateString('en-AU', { month: 'long', year: 'numeric' });
        const startWeekday = firstOfMonth.getDay(); // 0 = Sun
        const daysInMonth = new Date(year, month + 1, 0).getDate();
        const totalCells = Math.ceil((startWeekday + daysInMonth) / 7) * 7;

        let html = '<div class="calendar-layout">';

        // Month View Panel
        html += '<section class="panel" style="overflow:hidden">';
        html +=
          '<div class="panel-header">' +
            '<div class="calendar-nav">' +
              '<button class="btn btn-secondary btn-sm" id="calPrevBtn" aria-label="Previous month">' + ICONS.chevLeft + '</button>' +
              '<button class="btn btn-secondary btn-sm" id="calTodayBtn">Today</button>' +
              '<button class="btn btn-secondary btn-sm" id="calNextBtn" aria-label="Next month">' + ICONS.chevRight + '</button>' +
              '<span class="calendar-month-label" style="margin-left:6px">' + escapeHtml(monthLabel) + '</span>' +
            '</div>' +
            '<span style="font-size:12px;color:var(--text-muted)">Click a day to inspect or add events</span>' +
          '</div>';

        html += '<div class="calendar-weekdays">' +
          ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'].map(function (d) {
            return '<div class="calendar-weekday">' + d + '</div>';
          }).join('') +
        '</div>';

        html += '<div class="calendar-grid">';
        for (let i = 0; i < totalCells; i++) {
          const cellDate = new Date(year, month, 1 - startWeekday + i);
          const cellISO = formatDateISO(cellDate);
          const isCurrentMonth = cellDate.getMonth() === month;
          const isToday = cellISO === todayISO;
          const isSelected = uiState.calendarSelectedDate === cellISO;
          const dayEvents = eventsByDate[cellISO] || [];

          html +=
            '<div class="cal-cell' +
              (isCurrentMonth ? '' : ' other-month') +
              (isToday ? ' is-today' : '') +
              (isSelected ? ' selected' : '') +
            '" data-cal-date="' + cellISO + '">' +
              '<div class="cal-cell-head">' +
                '<span class="cal-day-num">' + cellDate.getDate() + '</span>' +
                '<button type="button" class="cal-add-mini" data-cal-quick-add="' + cellISO + '" title="Add event on ' + cellISO + '" aria-label="Add event on ' + cellISO + '">' + ICONS.plus + '</button>' +
              '</div>';

          dayEvents.slice(0, 2).forEach(function (ev) {
            html += '<button type="button" class="cal-event-pill" data-edit-event="' + ev.id + '" title="' + escapeHtml(ev.title) + '">' + escapeHtml(ev.title) + '</button>';
          });
          if (dayEvents.length > 2) {
            html += '<div class="cal-more-label">+' + (dayEvents.length - 2) + ' more</div>';
          }
          html += '</div>';
        }
        html += '</div></section>';

        // Chronological Events Panel
        const sortedAll = appState.data.calendar
          .slice()
          .sort(function (a, b) {
            if (a.date !== b.date) return a.date.localeCompare(b.date);
            return a.title.localeCompare(b.title);
          });

        const selectedDate = uiState.calendarSelectedDate;
        const activeTab = (uiState.calendarAgendaTab === 'selected' && !selectedDate) ? 'upcoming' : uiState.calendarAgendaTab;

        let listEvents;
        if (activeTab === 'selected' && selectedDate) {
          listEvents = sortedAll.filter(function (ev) { return ev.date === selectedDate; });
        } else if (activeTab === 'all') {
          listEvents = sortedAll;
        } else {
          listEvents = sortedAll.filter(function (ev) {
            const d = parseLocalDate(ev.date);
            return d && diffDays(today, d) >= 0;
          });
        }

        html += '<section class="panel" style="overflow:hidden">';
        html +=
          '<div class="panel-header">' +
            '<div class="panel-title-group">' +
              '<h2 class="panel-title">Chronological Events</h2>' +
              '<span class="panel-count">' + listEvents.length + '</span>' +
            '</div>' +
            (selectedDate
              ? '<button class="btn btn-secondary btn-sm" data-cal-quick-add="' + selectedDate + '">' + ICONS.plus + formatDisplayDate(selectedDate) + '</button>'
              : ''
            ) +
          '</div>';

        html += '<div class="agenda-tabs">';
        html += '<button class="agenda-tab' + (activeTab === 'upcoming' ? ' active' : '') + '" data-agenda-tab="upcoming">Upcoming</button>';
        if (selectedDate) {
          html += '<button class="agenda-tab' + (activeTab === 'selected' ? ' active' : '') + '" data-agenda-tab="selected">' + formatDisplayDate(selectedDate) + '</button>';
        }
        html += '<button class="agenda-tab' + (activeTab === 'all' ? ' active' : '') + '" data-agenda-tab="all">All (' + sortedAll.length + ')</button>';
        html += '</div>';

        if (listEvents.length === 0) {
          html +=
            '<div class="empty-state">' +
              '<div class="empty-state-icon">' + ICONS.calendar + '</div>' +
              '<div class="empty-state-title">' +
                (activeTab === 'selected' ? 'No events on ' + formatDisplayDate(selectedDate) : 'No events to display') +
              '</div>' +
              '<div class="empty-state-desc">Store appointments, birthdays, holidays, and fixed-date commitments here.</div>' +
              '<button class="btn btn-secondary btn-sm" id="calEmptyAddBtn">' + ICONS.plus + 'Add Event</button>' +
            '</div>';
        } else {
          html += '<div class="event-list">';
          listEvents.forEach(function (ev) {
            const d = parseLocalDate(ev.date);
            const delta = d ? diffDays(today, d) : 0;
            const monStr = d ? d.toLocaleDateString('en-AU', { month: 'short' }) : '';
            const dayNum = d ? d.getDate() : '';
            const isPast = delta < 0;
            const isEvToday = delta === 0;
            const badgeClass = isEvToday ? 'badge-today' : (isPast ? 'badge-neutral' : 'badge-upcoming');

            html +=
              '<div class="event-item' + (isPast ? ' is-past' : '') + (isEvToday ? ' is-today' : '') + '" data-event-id="' + ev.id + '">' +
                '<div class="event-date-box">' +
                  '<div class="event-date-mon">' + monStr + '</div>' +
                  '<div class="event-date-day">' + dayNum + '</div>' +
                '</div>' +
                '<div class="event-item-body">' +
                  '<div class="event-item-title">' + escapeHtml(ev.title) + '</div>' +
                  '<div class="event-item-meta">' +
                    '<span>' + (d ? d.toLocaleDateString('en-AU', { weekday: 'short', month: 'short', day: 'numeric', year: 'numeric' }) : ev.date) + '</span>' +
                    '<span class="badge ' + badgeClass + '">' + formatRelativeDays(delta) + '</span>' +
                  '</div>' +
                  (ev.notes ? '<div class="event-item-notes">' + escapeHtml(ev.notes) + '</div>' : '') +
                '</div>' +
                '<div class="event-item-actions">' +
                  '<button class="icon-action" data-edit-event="' + ev.id + '" title="Edit event" aria-label="Edit event">' + ICONS.edit + '</button>' +
                  '<button class="icon-action delete" data-delete-event="' + ev.id + '" title="Delete event" aria-label="Delete event">' + ICONS.trash + '</button>' +
                '</div>' +
              '</div>';
          });
          html += '</div>';
        }

        html += '</section></div>';
        root.innerHTML = html;

        // Bind Calendar events
        document.getElementById('calPrevBtn').addEventListener('click', function () {
          uiState.calendarMonth--;
          if (uiState.calendarMonth < 0) { uiState.calendarMonth = 11; uiState.calendarYear--; }
          renderCalendar(root);
        });
        document.getElementById('calNextBtn').addEventListener('click', function () {
          uiState.calendarMonth++;
          if (uiState.calendarMonth > 11) { uiState.calendarMonth = 0; uiState.calendarYear++; }
          renderCalendar(root);
        });
        document.getElementById('calTodayBtn').addEventListener('click', function () {
          const now = getTodayDate();
          uiState.calendarYear = now.getFullYear();
          uiState.calendarMonth = now.getMonth();
          uiState.calendarSelectedDate = formatDateISO(now);
          uiState.calendarAgendaTab = 'selected';
          renderCalendar(root);
        });

        root.querySelectorAll('[data-cal-date]').forEach(function (cell) {
          cell.addEventListener('click', function () {
            uiState.calendarSelectedDate = cell.dataset.calDate;
            uiState.calendarAgendaTab = 'selected';
            renderCalendar(root);
          });
        });

        root.querySelectorAll('[data-cal-quick-add]').forEach(function (btn) {
          btn.addEventListener('click', function (e) {
            e.stopPropagation();
            openCalendarModal(null, btn.dataset.calQuickAdd);
          });
        });

        root.querySelectorAll('[data-agenda-tab]').forEach(function (btn) {
          btn.addEventListener('click', function () {
            uiState.calendarAgendaTab = btn.dataset.agendaTab;
            renderCalendar(root);
          });
        });

        root.querySelectorAll('[data-edit-event]').forEach(function (btn) {
          btn.addEventListener('click', function (e) {
            e.stopPropagation();
            const ev = appState.data.calendar.find(function (item) { return item.id === btn.dataset.editEvent; });
            if (ev) openCalendarModal(ev);
          });
        });

        root.querySelectorAll('[data-delete-event]').forEach(function (btn) {
          btn.addEventListener('click', function (e) {
            e.stopPropagation();
            const ev = appState.data.calendar.find(function (item) { return item.id === btn.dataset.deleteEvent; });
            if (!ev) return;
            openConfirmModal({
              title: 'Delete Event',
              message: 'Are you sure you want to delete "' + ev.title + '"? This action cannot be undone.',
              confirmLabel: 'Delete',
              danger: true,
              onConfirm: function () {
                appState.data.calendar = appState.data.calendar.filter(function (item) { return item.id !== ev.id; });
                saveState();
                render();
                showToast('Event deleted', 'info');
              }
            });
          });
        });

        const emptyBtn = document.getElementById('calEmptyAddBtn');
        if (emptyBtn) {
          emptyBtn.addEventListener('click', function () {
            openCalendarModal(null, uiState.calendarSelectedDate || formatDateISO(getTodayDate()));
          });
        }
      }

      function openCalendarModal(ev, defaultDate) {
        const isEdit = Boolean(ev);
        const dateVal = isEdit ? ev.date : (defaultDate || formatDateISO(getTodayDate()));

        const bodyHtml =
          '<div class="form-field">' +
            '<label class="form-label" for="evTitle">Event Title <span class="req">*</span></label>' +
            '<input id="evTitle" class="form-input" type="text" maxlength="140" value="' + escapeHtml(isEdit ? ev.title : '') + '" placeholder="e.g., Dentist appointment, Mom\'s birthday">' +
          '</div>' +
          '<div class="form-field">' +
            '<label class="form-label" for="evDate">Date <span class="req">*</span></label>' +
            '<input id="evDate" class="form-input" type="date" value="' + escapeHtml(dateVal) + '">' +
          '</div>' +
          '<div class="form-field">' +
            '<label class="form-label" for="evNotes">Notes</label>' +
            '<textarea id="evNotes" class="form-textarea" placeholder="Location, time, or notes...">' + escapeHtml(isEdit ? (ev.notes || '') : '') + '</textarea>' +
          '</div>';

        openFormModal({
          title: isEdit ? 'Edit Event' : 'New Calendar Event',
          submitLabel: isEdit ? 'Save Changes' : 'Create Event',
          bodyHtml: bodyHtml,
          onSubmit: function () {
            const title = document.getElementById('evTitle').value.trim();
            const date = document.getElementById('evDate').value.trim();
            const notes = document.getElementById('evNotes').value.trim();

            if (!title) {
              setFormModalError('Please enter an event title.');
              return;
            }
            if (!isValidDateString(date)) {
              setFormModalError('Please select a valid date.');
              return;
            }

            if (isEdit) {
              ev.title = title;
              ev.date = date;
              ev.notes = notes;
              showToast('Event updated', 'success');
            } else {
              appState.data.calendar.push({
                id: generateId(),
                title: title,
                date: date,
                notes: notes
              });
              const d = parseLocalDate(date);
              if (d) {
                uiState.calendarYear = d.getFullYear();
                uiState.calendarMonth = d.getMonth();
              }
              showToast('Event created', 'success');
            }

            saveState();
            closeFormModal();
            render();
          }
        });
      }

      /* -----------------------------------------------------------------------
         7D. SUBSCRIPTIONS VIEW
         ----------------------------------------------------------------------- */
      function renderSubscriptions(root) {
        const enriched = appState.data.subscriptions.map(function (sub) {
          const renewal = calculateSubscriptionRenewal(sub);
          const monthly = normalizeMonthlyCost(sub.cost, sub.frequency);
          return { sub: sub, renewal: renewal, monthly: monthly };
        });

        const activeItems = enriched.filter(function (x) { return x.renewal.active; });
        const monthlyTotal = activeItems.reduce(function (acc, x) { return acc + x.monthly; }, 0);
        const yearlyTotal = monthlyTotal * 12;
        const renewingSoonCount = enriched.filter(function (x) { return x.renewal.renewingSoon; }).length;

        let visible = enriched.filter(function (x) {
          return uiState.subCategoryFilter === 'all' || x.sub.category === uiState.subCategoryFilter;
        });

        // Sort
        visible.sort(function (a, b) {
          if (uiState.subSortBy === 'cost') {
            return b.monthly - a.monthly;
          }
          if (uiState.subSortBy === 'name') {
            return a.sub.name.localeCompare(b.sub.name);
          }
          // Default: soonest renewal first, then ending, then ended
          const aRank = a.renewal.status === 'active' ? a.renewal.daysUntil : (a.renewal.status === 'ending' ? 100000 + a.renewal.daysUntilEnd : 999999);
          const bRank = b.renewal.status === 'active' ? b.renewal.daysUntil : (b.renewal.status === 'ending' ? 100000 + b.renewal.daysUntilEnd : 999999);
          if (aRank !== bRank) return aRank - bRank;
          return a.sub.name.localeCompare(b.sub.name);
        });

        let html = '';

        // Summary strip
        html += '<section class="sub-summary-strip">';
        html +=
          '<div class="sub-stat-card">' +
            '<div class="sub-stat-label">Monthly Recurring Cost</div>' +
            '<div class="sub-stat-value">' + formatCurrency(monthlyTotal) + '</div>' +
          '</div>' +
          '<div class="sub-stat-card">' +
            '<div class="sub-stat-label">Annualized Cost</div>' +
            '<div class="sub-stat-value">' + formatCurrency(yearlyTotal) + '</div>' +
          '</div>' +
          '<div class="sub-stat-card">' +
            '<div class="sub-stat-label">Active Subscriptions</div>' +
            '<div class="sub-stat-value">' + activeItems.length + '</div>' +
          '</div>' +
          '<div class="sub-stat-card' + (renewingSoonCount > 0 ? ' highlight' : '') + '">' +
            '<div class="sub-stat-label">Renewing Within 30 Days</div>' +
            '<div class="sub-stat-value">' + renewingSoonCount + '</div>' +
          '</div>';
        html += '</section>';

        // Controls
        html +=
          '<div class="section-toolbar">' +
            '<div class="sub-controls">' +
              '<select id="subCatFilter" class="sub-select" aria-label="Filter by category">' +
                '<option value="all"' + (uiState.subCategoryFilter === 'all' ? ' selected' : '') + '>All Categories</option>' +
                SUBSCRIPTION_CATEGORIES.map(function (cat) {
                  return '<option value="' + escapeHtml(cat) + '"' + (uiState.subCategoryFilter === cat ? ' selected' : '') + '>' + escapeHtml(cat) + '</option>';
                }).join('') +
              '</select>' +
              '<select id="subSortSelect" class="sub-select" aria-label="Sort subscriptions">' +
                '<option value="renewal"' + (uiState.subSortBy === 'renewal' ? ' selected' : '') + '>Sort: Next Renewal</option>' +
                '<option value="cost"' + (uiState.subSortBy === 'cost' ? ' selected' : '') + '>Sort: Highest Monthly Cost</option>' +
                '<option value="name"' + (uiState.subSortBy === 'name' ? ' selected' : '') + '>Sort: Name (A–Z)</option>' +
              '</select>' +
            '</div>' +
            '<span style="font-size:12.5px;color:var(--text-muted)">Highlighted rows renew within the next 30 days</span>' +
          '</div>';

        // Table panel
        html += '<section class="panel" style="overflow:hidden">';
        if (visible.length === 0) {
          html +=
            '<div class="empty-state" style="padding:42px 16px">' +
              '<div class="empty-state-icon">' + ICONS.repeat + '</div>' +
              '<div class="empty-state-title">' + (appState.data.subscriptions.length === 0 ? 'No subscriptions tracked yet' : 'No subscriptions in this category') + '</div>' +
              '<div class="empty-state-desc">Track recurring memberships, software, utilities, and services with automatic renewal dates.</div>' +
              (appState.data.subscriptions.length === 0
                ? '<button class="btn btn-primary btn-sm" id="subEmptyAddBtn">' + ICONS.plus + 'Add Subscription</button>'
                : ''
              ) +
            '</div>';
        } else {
          html +=
            '<div class="sub-table-wrap"><table class="sub-table">' +
              '<thead><tr>' +
                '<th>Subscription</th>' +
                '<th>Category</th>' +
                '<th>Cost</th>' +
                '<th>Frequency</th>' +
                '<th>Next Renewal</th>' +
                '<th>Start / End</th>' +
                '<th style="text-align:right">Actions</th>' +
              '</tr></thead><tbody>';

          visible.forEach(function (item) {
            const sub = item.sub;
            const r = item.renewal;
            const rowClass = r.renewingSoon ? 'renewing-soon' : (r.status === 'ended' ? 'is-ended' : '');

            let renewalHtml;
            if (r.status === 'active') {
              const rel = r.daysUntil === 0 ? 'Today' : (r.daysUntil === 1 ? 'In 1 day' : 'In ' + r.daysUntil + ' days');
              renewalHtml =
                '<div style="display:flex;align-items:center;gap:7px;flex-wrap:wrap">' +
                  '<span class="tabular-nums" style="font-weight:500">' + formatDisplayDate(r.nextRenewal, true) + '</span>' +
                  (r.renewingSoon
                    ? '<span class="badge badge-today">' + rel + '</span>'
                    : '<span class="badge badge-neutral">' + rel + '</span>'
                  ) +
                '</div>';
            } else if (r.status === 'ending') {
              renewalHtml = '<span class="badge badge-neutral">Ends ' + formatDisplayDate(r.endDate, true) + '</span>';
            } else {
              renewalHtml = '<span class="badge badge-neutral">Ended ' + formatDisplayDate(r.endDate, true) + '</span>';
            }

            html +=
              '<tr class="' + rowClass + '" data-sub-id="' + sub.id + '">' +
                '<td>' +
                  '<div class="sub-name">' + escapeHtml(sub.name) + '</div>' +
                  (sub.notes ? '<div class="sub-notes" title="' + escapeHtml(sub.notes) + '">' + escapeHtml(sub.notes) + '</div>' : '') +
                '</td>' +
                '<td><span class="badge badge-neutral">' + escapeHtml(sub.category) + '</span></td>' +
                '<td class="sub-cost-cell">' +
                  formatCurrency(sub.cost) +

      function updateGoalProgress(goalId, delta) {
        const goal = appState.data.goals.find(function (g) { return g.id === goalId; });
        if (!goal || !Number.isFinite(delta)) return;

        const wasCompleted = goal.current >= goal.target;
        goal.current = Math.max(0, roundClean(goal.current + delta));
        const isNowCompleted = goal.current >= goal.target;

        saveState();
        render();

        if (!wasCompleted && isNowCompleted) {
          showToast('Goal completed: "' + goal.title + '"!', 'success');
        }
      }

        const filter = uiState.goalFilter;
        const allGoals = appState.data.goals;
        const completedCount = allGoals.filter(function (g) { return g.current >= g.target; }).length;
        const activeCount = allGoals.length - completedCount;

        const visible = allGoals.filter(function (g) {
          if (filter === 'active') return g.current < g.target;
          if (filter === 'completed') return g.current >= g.target;
          return true;
        });

        let html =
          '<div class="section-toolbar">' +
            '<div class="filter-pills" role="group" aria-label="Filter goals">' +

              '<button class="filter-pill' + (filter === 'active' ? ' active' : '') + '" data-goal-filter="active">Active (' + activeCount + ')</button>' +
              '<button class="filter-pill' + (filter === 'completed' ? ' active' : '') + '" data-goal-filter="completed">Completed (' + completedCount + ')</button>' +
            '</div>' +
            '<span style="font-size:12.5px;color:var(--text-muted)">Use inline controls to update progress directly</span>' +
