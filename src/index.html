<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Personal OS — Productivity Dashboard</title>
  <link rel="icon" type="image/svg+xml" href="./assets/favicon.svg">
  <script>
    // Apply saved theme before first paint to prevent flash of wrong theme
    (function () {
      try {
        var raw = localStorage.getItem('personal_os_dashboard_v1');
        var theme = null;
        if (raw) {
          var parsed = JSON.parse(raw);
          if (parsed && parsed.settings && (parsed.settings.theme === 'dark' || parsed.settings.theme === 'light')) {
            theme = parsed.settings.theme;
          }
        }
        if (!theme) {
          theme = (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
        }
        document.documentElement.setAttribute('data-theme', theme);
      } catch (e) {
        document.documentElement.setAttribute('data-theme', 'light');
      }
    })();
  </script>
  <link rel="stylesheet" href="./css/tokens.css">
  <link rel="stylesheet" href="./css/base.css">
  <link rel="stylesheet" href="./css/views.css">
</head>
<body>
  <div class="app-shell">
    <!-- Sidebar Backdrop (narrow viewports) -->
    <div id="sidebarOverlay" class="sidebar-overlay"></div>

    <!-- Left Sidebar -->
    <aside id="sidebar" class="sidebar" aria-label="Primary Navigation">
      <div class="sidebar-brand">
        <div class="brand-logo" aria-hidden="true">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="3" width="7" height="7" rx="1.5"></rect>
            <rect x="14" y="3" width="7" height="7" rx="1.5"></rect>
            <rect x="3" y="14" width="7" height="7" rx="1.5"></rect>
            <path d="M14 17.5h7M17.5 14v7"></path>
          </svg>
        </div>
        <div class="brand-text">
          <span class="brand-name">Personal OS</span>
          <span class="brand-sub">Offline Workspace</span>
        </div>
      </div>

      <nav class="sidebar-nav" id="sidebarNav">
        <div class="nav-label">Workspace</div>
        <button class="nav-item active" data-view="dashboard">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="3" width="7" height="9" rx="1"></rect>
            <rect x="14" y="3" width="7" height="5" rx="1"></rect>
            <rect x="14" y="12" width="7" height="9" rx="1"></rect>
            <rect x="3" y="16" width="7" height="5" rx="1"></rect>
          </svg>
          <span class="nav-item-label">Dashboard</span>
        </button>

        <button class="nav-item" data-view="kanban">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="3" width="18" height="18" rx="2"></rect>
            <path d="M9 3v18M15 3v18"></path>
          </svg>
          <span class="nav-item-label">Kanban</span>
          <span class="nav-badge" id="navBadgeKanban"></span>
        </button>

        <button class="nav-item" data-view="calendar">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="4" width="18" height="18" rx="2"></rect>
            <path d="M16 2v4M8 2v4M3 10h18"></path>
          </svg>
          <span class="nav-item-label">Calendar</span>
          <span class="nav-badge" id="navBadgeCalendar"></span>
        </button>

        <button class="nav-item" data-view="subscriptions">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12a9 9 0 0 0-9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path>
            <path d="M3 3v5h5"></path>
            <path d="M3 12a9 9 0 0 0 9 9 9.75 9.75 0 0 0 6.74-2.74L21 16"></path>
            <path d="M16 16h5v5"></path>
          </svg>
          <span class="nav-item-label">Subscriptions</span>
          <span class="nav-badge" id="navBadgeSubscriptions"></span>
        </button>

        <button class="nav-item" data-view="goals">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="9"></circle>
            <circle cx="12" cy="12" r="5"></circle>
            <circle cx="12" cy="12" r="1.5" fill="currentColor"></circle>
          </svg>
          <span class="nav-item-label">Goals</span>
          <span class="nav-badge" id="navBadgeGoals"></span>
        </button>
      </nav>

      <!-- Unobtrusive Settings / Backup Footer -->
      <div class="sidebar-footer">
        <div class="backup-title">
          <span>Data Backup</span>
          <span>Local</span>
        </div>
        <div class="backup-actions">
          <button class="btn-backup" id="btnExportData" title="Export all data as JSON">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
              <polyline points="7 10 12 15 17 10"></polyline>
              <line x1="12" y1="15" x2="12" y2="3"></line>
            </svg>
            Export data
          </button>
          <button class="btn-backup" id="btnImportData" title="Import data from a backup JSON file">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
              <polyline points="17 8 12 3 7 8"></polyline>
              <line x1="12" y1="3" x2="12" y2="15"></line>
            </svg>
            Import data
          </button>
        </div>
        <input type="file" id="importFileInput" accept=".json,application/json" hidden>
      </div>
    </aside>

    <!-- Main Content Column -->
    <div class="main-area">
      <header class="topbar">
        <div class="topbar-left">
          <button class="mobile-menu-btn" id="mobileMenuBtn" aria-label="Open menu">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
              <line x1="4" y1="6" x2="20" y2="6"></line>
              <line x1="4" y1="12" x2="20" y2="12"></line>
              <line x1="4" y1="18" x2="20" y2="18"></line>
            </svg>
          </button>
          <div class="page-heading">
            <h1 class="page-title" id="topbarTitle">Dashboard</h1>
            <span class="page-subtitle" id="topbarSubtitle"></span>
          </div>
        </div>

        <div class="topbar-right">
          <!-- Global Search -->
          <div class="search-container" id="searchContainer">
            <div class="search-input-wrap">
              <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="11" cy="11" r="8"></circle>
                <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
              </svg>
              <input
                type="text"
                id="globalSearchInput"
                class="search-input"
                placeholder="Search everything..."
                autocomplete="off"
                aria-label="Global search"
              >
              <span class="search-kbd">Ctrl K</span>
              <button class="search-clear" id="searchClearBtn" aria-label="Clear search">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                  <line x1="18" y1="6" x2="6" y2="18"></line>
                  <line x1="6" y1="6" x2="18" y2="18"></line>
                </svg>
              </button>
            </div>
            <div class="search-dropdown" id="searchDropdown" role="listbox"></div>
          </div>

          <!-- Theme Toggle -->
          <button class="btn btn-icon" id="themeToggleBtn" title="Toggle dark/light mode" aria-label="Toggle dark/light mode"></button>

          <!-- Primary Contextual CTA -->
          <button class="btn btn-primary" id="topbarPrimaryBtn"></button>
        </div>
      </header>

      <main class="workspace" id="workspace">
        <div class="workspace-inner" id="viewRoot"></div>
      </main>
    </div>
  </div>

  <!-- Form Modal -->
  <div class="modal-backdrop" id="formModalBackdrop" role="dialog" aria-modal="true" aria-labelledby="formModalTitle">
    <div class="modal">
      <div class="modal-header">
        <h2 class="modal-title" id="formModalTitle"></h2>
        <button class="icon-action" id="formModalClose" aria-label="Close dialog">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
      </div>
      <form id="modalForm" novalidate>
        <div class="modal-body" id="formModalBody"></div>
        <div class="modal-footer" id="formModalFooter"></div>
      </form>
    </div>
  </div>

  <!-- Confirmation / Alert Modal -->
  <div class="modal-backdrop confirm-layer" id="confirmModalBackdrop" role="alertdialog" aria-modal="true" aria-labelledby="confirmModalTitle">
    <div class="modal modal-sm">
      <div class="modal-header">
        <h2 class="modal-title" id="confirmModalTitle"></h2>
        <button class="icon-action" id="confirmModalClose" aria-label="Close dialog">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
      </div>
      <div class="modal-body" id="confirmModalBody"></div>
      <div class="modal-footer" id="confirmModalFooter"></div>
    </div>
  </div>

  <!-- Toast Notifications -->
  <div class="toast-stack" id="toastStack" aria-live="polite"></div>

  <script type="module" src="./js/main.js"></script>
</body>
</html>
