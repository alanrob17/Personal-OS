[package]
name = "personal-os-dashboard"
version = "1.0.0"
description = "Personal OS — Offline Productivity Dashboard"
authors = ["Personal OS"]
edition = "2021"
rust-version = "1.87"
resolver = "3"

[lib]
name = "personal_os_dashboard_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
